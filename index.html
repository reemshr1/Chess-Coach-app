<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach's Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* white, blue, light green and yellow */
  --paper:#F7FAF5; --surface:#FFFFFF; --ink:#16243F; --muted:#5E6B7E; --line:#DFE7DA;
  --sq-dark:#1E4E9C; --sq-light:#DDF2D5; --accent:#1E4E9C; --accent-ink:#FFFFFF;
  --flag:#C2412D; --flag-bg:#FCE5E1; --ok:#2E7D4F; --ok-bg:#DDF2D5; --warn:#7A5A00; --warn-bg:#FFE9A0;
  --yellow:#FFD54F; --green:#7CC36A; --side:#1E4E9C; --side-ink:#DCE7FA; --side-on:#DDF2D5; --side-on-ink:#16243F;
  --board-l:#F4F9EF; --board-d:#8DBF73;
  --wk-head:#1E4E9C; --wk-today:#DDF2D5; --ev-bg:#1E4E9C; --ev-sub:#DCE7FA; --ev-done:#2E9C5A; --ev-done-sub:#E2F5E4;
  --free-a:#D3EEC8; --free-b:#E6F5DE; --tour:#16243F; --due-bg:#FFD54F; --due-ink:#16243F;
  --tint-blue:#E3ECFA; --tint-green:#DDF2D5; --tint-yellow:#FFF1B8;
  --shadow:0 2px 6px rgba(22,36,63,.06);
  --r-sm:6px; --r-md:10px;
  --display:"Sora", "Heebo", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --surface:#172131; --ink:#E6ECF5; --muted:#9AA8BE; --line:#2A3647;
    --sq-dark:#7FA9F0; --sq-light:#22402C; --accent:#7FA9F0; --accent-ink:#0B1220;
    --flag:#E57D66; --flag-bg:#3A221C; --ok:#7CC39D; --ok-bg:#1D3326; --warn:#F2D16B; --warn-bg:#3A3218;
    --yellow:#E8C246; --green:#6FB35E; --side:#13284A; --side-ink:#C9D7F0; --side-on:#2C5A36; --side-on-ink:#E6F5E0;
    --board-l:#C9D9BF; --board-d:#5E8C4A;
    --wk-head:#13284A; --wk-today:#2C5A36; --ev-bg:#2F63B8; --ev-sub:#DCE7FA; --ev-done:#2E7D4F; --ev-done-sub:#D8F0DF;
    --free-a:#1F3A26; --free-b:#18301F; --tour:#0A1220; --due-bg:#E8C246; --due-ink:#16243F;
    --tint-blue:#1B2D4D; --tint-green:#1F3A26; --tint-yellow:#3A3218;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --surface:#172131; --ink:#E6ECF5; --muted:#9AA8BE; --line:#2A3647;
  --sq-dark:#7FA9F0; --sq-light:#22402C; --accent:#7FA9F0; --accent-ink:#0B1220;
  --flag:#E57D66; --flag-bg:#3A221C; --ok:#7CC39D; --ok-bg:#1D3326; --warn:#F2D16B; --warn-bg:#3A3218;
  --yellow:#E8C246; --green:#6FB35E; --side:#13284A; --side-ink:#C9D7F0; --side-on:#2C5A36; --side-on-ink:#E6F5E0;
  --board-l:#C9D9BF; --board-d:#5E8C4A;
  --wk-head:#13284A; --wk-today:#2C5A36; --ev-bg:#2F63B8; --ev-sub:#DCE7FA; --ev-done:#2E7D4F; --ev-done-sub:#D8F0DF;
  --free-a:#1F3A26; --free-b:#18301F; --tour:#0A1220; --due-bg:#E8C246; --due-ink:#16243F;
  --tint-blue:#1B2D4D; --tint-green:#1F3A26; --tint-yellow:#3A3218;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
/* links read as bold text, not underlined hyperlinks; they turn blue on hover */
a{color:inherit;text-decoration:none;font-weight:600}
a:hover{color:var(--accent)}
a.btn,.nav a,.tabs a,.bottom-nav a,.stat-link,.crumb,.chip-ev,.side-search{font-weight:inherit}
.nav a,.tabs a{font-weight:500}
.stat-link:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand-mark{width:28px;height:28px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border-radius:4px;overflow:hidden;flex:none}
.brand-mark i:nth-child(1),.brand-mark i:nth-child(4){background:var(--sq-dark)}
.brand-mark i:nth-child(2),.brand-mark i:nth-child(3){background:var(--sq-light)}
.brand b{font-family:var(--display);font-size:1.02rem}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--paper)}
.nav a[aria-current="page"]{background:var(--sq-light);color:var(--ink)}
.nav-badge{font-style:normal;background:var(--flag);color:#fff;border-radius:999px;font-size:.68rem;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;margin-inline-start:auto;line-height:1}
.bottom-nav a{position:relative}
.bottom-nav .nav-badge{position:absolute;top:0;inset-inline-end:calc(50% - 20px);min-width:16px;height:16px;font-size:.6rem}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 10px}
/* the blue side menu */
.side{background:var(--side);border-color:var(--side);color:#fff}
.side .brand b{color:#fff}
.side .nav a{color:var(--side-ink)}
.side .nav a:hover{background:rgba(255,255,255,.08)}
.side .nav a[aria-current="page"]{background:var(--side-on);color:var(--side-on-ink)}
.side .side-foot{color:var(--side-ink)}
.side .side-search{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:var(--side-ink)}
.side .side-search:hover{border-color:rgba(255,255,255,.5)}
.side .side-search kbd{background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.35)}
.side .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.side select{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.side select option{color:#16243F}
.side .dot.ok{background:var(--green)}
.brand-mark i:nth-child(1),.brand-mark i:nth-child(4){background:var(--yellow)!important}
.brand-mark i:nth-child(2),.brand-mark i:nth-child(3){background:#fff!important}
.topbar .brand-mark{box-shadow:0 0 0 1px var(--line)}
/* each headline number gets a thin colour bar */
.stat{border-top:3px solid transparent}
.stats .stat:nth-child(4n+1){border-top-color:var(--sq-dark)}
.stats .stat:nth-child(4n+2){border-top-color:var(--green)}
.stats .stat:nth-child(4n+3){border-top-color:var(--yellow)}
.stats .stat:nth-child(4n+4){border-top-color:var(--sq-dark)}
.stats-5 .stat:nth-child(5){border-top-color:var(--green)}
.tag.warn{color:var(--warn)}
.bottom-nav a[aria-current="page"]{background:var(--side-on)!important;color:var(--side-on-ink)!important}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-search{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);text-decoration:none;background:var(--paper)}
.side-search:hover{border-color:var(--muted)}
.side-search span{flex:1}
kbd{font-family:var(--body);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--surface);color:var(--muted)}
.topbar{display:none}
.btn.lang-btn{display:none}
.student-mode .btn.lang-btn{display:inline-flex}
.student-mode .side-search,.student-mode .topbar a[href="#/search"]{display:none}
/* a parent's board is view-only apart from lesson requests and changes */
.parent-mode #view button[data-a]:not([data-a="req"]):not([data-a="reqat"]):not([data-a="les"]):not([data-a="open"]):not([data-a="ans"]):not([data-a="unreq"]):not([data-a="reqx"]):not([data-a="view"]):not([data-a="wk"]):not([data-a="more"]):not([data-a="all"]):not([data-a="src"]):not([data-a="gf"]):not([data-a="f"]):not([data-a="sf"]):not([data-a="rf"]):not([data-a="period"]):not([data-a="board"]):not([data-a="games"]):not([data-a="clearT"]):not([data-a="clearRep"]):not([data-a="dl"]):not([data-a="pp"]):not([data-a="ps"]){display:none}
.parent-mode #view label:has(input[type=file]),.parent-mode #view .dropzone{display:none}
.code-box{font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:.18em;background:var(--paper);border:1px dashed var(--line);border-radius:var(--r-sm);padding:6px 14px;display:inline-block;direction:ltr}
.steps{margin:8px 0 12px;padding-inline-start:20px;font-size:.92rem}
.steps li{margin-bottom:4px}
.search-big{width:100%;font-size:1.05rem;padding:10px 14px;margin-bottom:18px}
.hit{display:block;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hit:first-child{border-top:0}
.hit:hover .title{text-decoration:underline}
.hit .title{font-weight:600}
.hit mark{background:var(--warn-bg);color:inherit;border-radius:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-end:6px;vertical-align:middle}
.dot.busy{background:var(--warn)} .dot.local{background:var(--muted)} .dot.err{background:var(--flag)}
main{padding:32px clamp(16px,4vw,48px) 96px;max-width:1180px;width:100%;min-width:0}
.bottom-nav{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px 16px}
  .topbar .brand{padding:0}
  .topbar .ic{width:22px;height:22px}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:var(--r-sm);min-width:56px}
  .bottom-nav a[aria-current="page"]{color:var(--ink);background:var(--sq-light)}
  .bottom-nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .student-mode .bottom-nav a{min-width:0;flex:1 1 0;padding:4px 1px;font-size:.6rem;overflow:hidden}
  .student-mode .bottom-nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* Common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sub{color:var(--muted);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--paper)}
.btn.danger{color:var(--flag)}
.row-actions{display:flex;gap:4px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{color:var(--muted);padding:14px 0;font-size:.92rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .main{min-width:0;flex:1}
.list .title{font-weight:600}
.tag{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.flag{background:var(--flag-bg);border-color:transparent;color:var(--flag)}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.tag.board{background:var(--sq-light);border-color:transparent;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.money-owed{color:var(--flag);font-weight:600}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:start;font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:end}
tr:last-child td{border-bottom:0}
.pre{white-space:pre-wrap;font-size:.9rem}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:20px;overflow:hidden}
.stat{padding:16px 18px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat .v{font-family:var(--display);font-size:1.45rem;font-weight:600}
.stat .l{color:var(--muted);font-size:.85rem}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* Students */
.search{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-width:220px}
.student-row{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1.6fr) 120px;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.student-row:first-of-type{border-top:0}
.student-row:hover{background:var(--paper)}
.student-row .name{font-weight:600;font-family:var(--display)}
@media (max-width:820px){.student-row{grid-template-columns:1fr auto;gap:4px 12px}.student-row .hide-m{display:none}}
.avatar{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:600;background:var(--sq-light);flex:none}
.who{display:flex;align-items:center;gap:12px;min-width:0}


/* Student header & tabs */
.s-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.s-head .avatar{width:56px;height:56px;font-size:1.3rem;border-radius:8px}
.crumb{font-size:.88rem;margin-bottom:10px;display:inline-block;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sq-dark)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.off-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--sq-light);color:var(--ink);font-weight:600}
.chart{width:100%;height:170px;display:block}
.chart .grid-l{stroke:var(--line)}
.chart .line{stroke:var(--sq-dark);fill:none;stroke-width:2}
.chart .area{fill:var(--sq-light);opacity:.6}
.chart circle{fill:var(--surface);stroke:var(--sq-dark);stroke-width:2}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--sq-dark)}
.done .title{text-decoration:line-through;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.week div{text-align:center;font-size:.72rem;color:var(--muted)}
.week span{display:block;height:28px;border-radius:3px;background:var(--paper);border:1px solid var(--line);margin-bottom:3px}
.week span.l1{background:var(--sq-light);border-color:var(--sq-light)}
.week span.l2{background:var(--sq-dark);border-color:var(--sq-dark);opacity:.65}
.week span.l3{background:var(--sq-dark);border-color:var(--sq-dark)}
.expect{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.rep-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rep-tools .search{min-width:0;flex:1 1 200px}
.rep-tools select.search{flex:0 1 240px}
.rep-first{font-family:var(--display);font-size:.95rem;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rep-first:first-of-type{margin-top:0}
.rep-group{margin:8px 0 12px}
.rep-vs{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.rep-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.rep-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rep-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.rep-gaps{margin:4px 0 10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-size:.8rem;cursor:pointer;color:var(--ink)}
.chip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip:hover{border-color:var(--muted)}
.rep-col h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.piece{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--ink)}
.piece.w{background:#fff}.piece.b{background:#1C2620}
.line-box{font-size:.86rem;background:var(--paper);border-radius:var(--r-sm);padding:6px 10px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.date-group{margin-bottom:18px}
.date-group > h3{font-size:.9rem;color:var(--muted);font-weight:600;margin-bottom:6px}

/* Modal */
dialog{border:1px solid var(--line);border-radius:var(--r-md);padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(15,20,17,.45)}
.modal-form{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.modal-form header{padding:18px 20px 6px}
.modal-body{padding:10px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal-form footer{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field[hidden]{display:none}
.field label{font-size:.84rem;font-weight:600}
.form-err{margin:0;padding:8px 20px;color:var(--flag);font-size:.88rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);width:100%}
.field textarea{min-height:78px;resize:vertical}
@media (max-width:520px){.modal-body{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-sm);font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:820px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.welcome{max-width:560px;padding:40px 0}
.welcome .board{display:grid;grid-template-columns:repeat(8,22px);border:1px solid var(--line);width:max-content;margin-bottom:22px;border-radius:4px;overflow:hidden}
.welcome .board i{height:22px}
.welcome .board i.d{background:var(--board-d)} .welcome .board i.l{background:var(--board-l)}
.as-item{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-inline-end:14px}
.as-item:first-of-type{border-top:0}
.as-item .as-row{flex:1;border-top:0;min-width:0}
.as-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.as-row:first-of-type{border-top:0}
.as-row:hover{background:var(--paper)}
.as-row .main{min-width:0;flex:1}
.as-row .title{font-weight:600}
.drop{margin-top:12px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--muted);font-size:.9rem}
.drop.over{border-color:var(--sq-dark);background:var(--sq-light);color:var(--ink)}
.fb{width:100%;min-height:120px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);resize:vertical}
dialog.wide{width:min(960px,calc(100vw - 24px))}
.viewer{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;padding:12px 20px 20px;overflow-y:auto}
@media (max-width:720px){.viewer{grid-template-columns:1fr}}
.cboard{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cboard .sq{position:relative;display:grid;place-items:center;aspect-ratio:1;min-width:0}
.cboard .sq.l{background:var(--board-l)}.cboard .sq.d{background:var(--board-d)}
.cboard .sq.hl::before{content:"";position:absolute;inset:0;background:rgba(247,214,70,.5)}
.cboard .pc{position:relative;z-index:1;width:88%;height:88%;user-select:none;pointer-events:none}
.cboard .pc path{stroke:#1C2620;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cboard .pc.w .f{fill:#FCFCF7}.cboard .pc.b .f{fill:#1C2620}
.cboard .pc.w .d{stroke:#1C2620}.cboard .pc.b .d{stroke:#E8E6D8}
.cboard .pc .d0{stroke:#1C2620}
.cboard .co{position:absolute;font-size:10px;font-weight:600;line-height:1;z-index:2}
.cboard .co.r{left:3px;top:3px}.cboard .co.f{right:3px;bottom:2px}
.cboard .sq.l .co{color:var(--board-d)}.cboard .sq.d .co{color:var(--board-l)}
.vctl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.moves{display:grid;grid-template-columns:40px 1fr 1fr;gap:2px 4px;max-height:420px;overflow-y:auto;font-variant-numeric:tabular-nums;align-content:start}
.moves .mn{color:var(--muted);font-size:.85rem;padding:4px 0}
.moves .mv{border:0;background:transparent;text-align:start;padding:4px 8px;border-radius:4px;cursor:pointer;font-weight:500}
.moves .mv:hover{background:var(--paper)}
.moves .mv.cur{background:var(--sq-dark);color:#fff}
.moves .res{font-weight:600;padding:4px 8px}
.tstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tstats .v{font-family:var(--display);font-size:1.3rem;font-weight:600}
.tstats .l{font-size:.78rem;color:var(--muted)}
@media (max-width:480px){.tstats{grid-template-columns:1fr 1fr}}
.wbars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:150px;align-items:end}
.wbars > div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.wbars .bar{width:70%;background:var(--sq-dark);border-radius:3px 3px 0 0;max-height:100px;flex:none}
.wbars .pct{font-size:.7rem;color:var(--muted);margin-bottom:2px}
.wbars .vol{height:3px;background:var(--muted);opacity:.5;margin-top:3px;border-radius:2px;align-self:flex-start;margin-left:15%;max-width:70%}
.wbars .wl{font-size:.68rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.tstats[hidden]{display:none}
.subh{font-size:.85rem;color:var(--muted);margin:18px 0 8px;font-family:var(--body);font-weight:600}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pb{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--paper)}
.pb-top{display:flex;align-items:center;gap:10px;margin:4px 0 6px;line-height:1.25}
.pb-v{font-family:var(--display);font-size:2rem;font-weight:700}
.spark{width:100%;height:44px;display:block;margin-bottom:4px}
.spark polyline{fill:none;stroke:var(--sq-dark);stroke-width:1.8;vector-effect:non-scaling-stroke}
.spark .pbl{stroke:var(--muted);stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--sq-dark)}
.shelf-h{font-size:1rem;margin:22px 0 10px;display:flex;gap:8px;align-items:baseline}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:480px){.shelf{grid-template-columns:1fr}}
.book{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.book.fin{opacity:.85}
.spine{width:10px;flex:none;background:var(--sq-dark)}
.book-main{padding:14px 16px;min-width:0;flex:1}
.book-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.book h3{font-size:1rem;overflow-wrap:anywhere}
.prog{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--paper) 0 8px,var(--line) 8px 16px);overflow:hidden;margin-bottom:6px}
.prog span{display:block;height:100%;background:var(--sq-dark);border-radius:4px}
.bhist{margin-top:8px}
.bhist summary{cursor:pointer;color:var(--accent);font-weight:500}
.bhist .list li{padding:6px 0}
.seg a{padding:6px 14px;font-size:.88rem;color:var(--muted);text-decoration:none}
.seg a.on{background:var(--sq-light);color:var(--ink);font-weight:600}
.res-W{color:var(--ok);font-weight:600}.res-L{color:var(--flag);font-weight:600}.res-D{color:var(--muted);font-weight:600}
.sched-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sched-title{font-family:var(--display);font-size:1rem}
.clash-box{background:var(--flag-bg);color:var(--flag);border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.clash-box .btn{color:var(--flag)}
.wk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.wk{min-width:820px}
.wk-row{display:grid;grid-template-columns:56px repeat(7,minmax(108px,1fr))}
.wk.wk-few{min-width:0}
.wk.wk-few .wk-row{grid-template-columns:44px repeat(var(--days),minmax(0,1fr))}
.wk-few .ev{padding:3px 4px}
.wk-corner{border-bottom:1px solid var(--line);padding:6px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:.72rem}
.wk-dh{border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 8px 6px;display:flex;gap:6px;align-items:baseline}
.wk-dh span{font-size:.78rem;color:var(--muted)}
.wk-dh b{font-family:var(--display);font-size:1.1rem}
.wk-dh.today b{background:var(--sq-dark);color:#fff;border-radius:6px;padding:0 6px}
.wk-ad{border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:30px}
.chip-ev{display:block;font-size:.74rem;padding:3px 6px;border-radius:4px;border:0;text-align:start;text-decoration:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-family:inherit;width:100%}
.chip-ev.tour{background:var(--sq-dark);color:#fff;cursor:default}
.chip-ev.due{background:var(--warn-bg);color:var(--warn)}
.chip-ev.ses{background:var(--sq-light)}
.chip-ev.cx{opacity:.5;text-decoration:line-through}
.chip-ev.clash{box-shadow:inset 0 0 0 2px var(--flag)}
.wk-times{position:relative}
.wk-times span{position:absolute;inset-inline-end:6px;transform:translateY(-50%);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-times span:first-child{transform:none}
.wk-day{position:relative;border-inline-start:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--line) 47px 48px);cursor:copy}
.wk-day.today{background-color:color-mix(in srgb,var(--sq-light) 30%,transparent)}
.ev{position:absolute;border:0;border-inline-start:3px solid var(--sq-dark);background:var(--sq-light);color:var(--ink);border-radius:5px;padding:3px 6px;text-align:start;font-family:inherit;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--muted);white-space:nowrap}
.ev.st-done{background:var(--ok-bg);border-inline-start-color:var(--ok)}
.ev.st-cancelled{opacity:.45;text-decoration:line-through}
.ev.clash{box-shadow:inset 0 0 0 2px var(--flag);border-inline-start-color:var(--flag)}
.ev:hover{filter:brightness(.97)}
.wk-free{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--ok) 13%,transparent);border-top:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ok) 45%,transparent);pointer-events:none}
.wk-taken{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 16%,transparent) 0 6px,transparent 6px 12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
.wk-taken span{position:absolute;inset-inline-end:4px;top:2px;font-size:.66rem;color:var(--muted);font-weight:600;white-space:nowrap}
.wk-free span{position:absolute;inset-inline-end:4px;top:2px;font-size:.66rem;color:var(--ok);font-weight:600;white-space:nowrap}
.ev.train,.chip-ev.train{background:var(--surface);border:1px dashed var(--sq-dark);border-inline-start:3px solid var(--sq-dark)}
.ev.req,.chip-ev.req{background:var(--warn-bg);border-inline-start-color:var(--warn)}
.ev.req.st-declined,.chip-ev.req.st-declined{opacity:.5;text-decoration:line-through}
/* boxes with a title get a blue title bar; headline numbers are tinted tiles */
.panel:has(> .panel-head){padding:0 20px 16px;overflow:hidden;border:2px solid var(--side);border-radius:12px}
.panel:has(> .panel-head)[style*="border-color"]:not([style*="--flag"]){border-color:var(--side)!important}
.panel > .panel-head{background:var(--side);margin:0 -20px 12px;padding:12px 20px;flex-wrap:wrap}
.panel > .panel-head h2{color:#fff}
.panel > .panel-head :is(span,p,div).small,.panel > .panel-head .muted:not(.btn){color:var(--side-ink)!important}
.panel > .panel-head .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.panel > .panel-head .btn:hover{background:rgba(255,255,255,.2)}
.panel > .panel-head .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#16243F}
.panel > .panel-head .tag{background:var(--yellow);border-color:transparent;color:#16243F}
.panel > .panel-head a{color:#fff}
.panel[style*="--flag"] > .panel-head{background:var(--flag)}
.stats{border:0;background:transparent;gap:12px;overflow:visible}
.stats .stat,.stats .stat-link{border:0!important;border-radius:14px;padding:18px 20px}
.stats > :nth-child(4n+1){background:var(--tint-blue)}.stats > :nth-child(4n+2){background:var(--tint-green)}
.stats > :nth-child(4n+3){background:var(--tint-yellow)}.stats > :nth-child(4n+4){background:var(--tint-blue)}
.stats-5 > :nth-child(5){background:var(--tint-green)}
.stats .stat .v{font-size:1.7rem}
.stats-5 .stat .v{font-size:1.35rem}
/* students as cards */
.card-l{display:none}
#slist{background:transparent;border:0;box-shadow:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
#slist > .empty{grid-column:1/-1;background:var(--surface);border-radius:12px}
#slist .student-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"who who" "rat bal" "next next";gap:10px;border:2px solid var(--side);border-radius:14px;background:var(--surface);padding:0 0 14px;overflow:hidden}
#slist .student-row .who{grid-area:who;background:var(--side);color:#fff;padding:12px 16px}
#slist .student-row .who .muted{color:var(--side-ink)}
#slist .student-row .avatar{background:#4F86E0;color:#fff;border-radius:50%;box-shadow:0 0 0 2px #fff}
#slist .student-row > .num:nth-child(2){grid-area:rat;padding-inline-start:16px}
#slist .student-row .card-l{display:block}
#slist .student-row > :nth-child(3){grid-area:next;padding:0 16px;display:block!important}
#slist .student-row > :nth-child(4){grid-area:bal;padding-inline-end:16px;align-self:end}
#slist .student-row:hover{background:var(--surface);box-shadow:0 4px 12px rgba(22,36,63,.12)}
/* forms */
dialog{border:2px solid var(--side);border-radius:14px}
.modal-form header{border-bottom:3px solid var(--yellow);padding-bottom:12px;margin-bottom:6px}
.modal-form header h2{color:var(--accent)}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select,.field textarea{background:var(--tint-blue);border:0;border-bottom:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px 6px 0 0}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--accent);background:color-mix(in srgb,var(--tint-blue) 70%,var(--accent) 12%)}
/* schedule table: blue date row, solid lesson cards, striped free time, navy tournaments, yellow due dates */
.wk-wrap{border:2px solid var(--wk-head);border-radius:12px}
.wk-row:first-child{background:var(--wk-head)}
.wk-row:first-child .wk-corner{border-color:rgba(255,255,255,.15)}
.wk-dh{border-color:rgba(255,255,255,.15);padding:10px 10px 8px}
.wk-dh span{color:#DCE7FA}.wk-dh b{color:#fff}
.wk-dh.today{background:var(--wk-today)}.wk-dh.today span{color:var(--accent)}.wk-dh.today b{background:transparent;color:var(--ink);padding:0}
.wk-free{background:repeating-linear-gradient(135deg,var(--free-a) 0 8px,var(--free-b) 8px 16px);border:0}
.ev{background:var(--ev-bg);color:#fff;border:0;border-radius:8px;padding:5px 8px;box-shadow:0 1px 3px rgba(22,36,63,.2)}
.ev span{color:var(--ev-sub)}
.ev.st-done{background:var(--ev-done)}.ev.st-done span{color:var(--ev-done-sub)}
.ev.clash{box-shadow:0 0 0 2px var(--flag);border-inline-start-color:transparent}
.ev.train,.ev.req{color:var(--ink);box-shadow:none}.ev.train span,.ev.req span{color:var(--muted)}
.ev.train{background:var(--surface);border:1px dashed var(--accent);border-inline-start:3px solid var(--accent)}
.ev.req{background:var(--warn-bg);border-inline-start:3px solid var(--warn)}
.chip-ev.ses{background:var(--ev-bg);color:#fff;border-radius:6px}
.chip-ev.tour{background:var(--tour);color:#fff}
.chip-ev.due{background:var(--due-bg);color:var(--due-ink);font-weight:600}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--flag);z-index:2}
.wk-now::before{content:"";position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--flag)}
.stats-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat-link{text-decoration:none;color:var(--ink);display:block}
.stat-link:hover{filter:brightness(.97)}
.stat-link .v{font-size:1.2rem}
.warn-text{color:var(--warn)}
.note-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:var(--r-md);padding:10px 14px;margin-bottom:16px;font-size:.9rem}
@media (max-width:900px){.stats-5{grid-template-columns:repeat(3,minmax(0,1fr))}.stats-5 .stat:nth-child(4){border-inline-start:0}.stats-5 .stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:520px){.stats-5{grid-template-columns:1fr 1fr}.stats-5 .stat{border-inline-start:1px solid var(--line)}.stats-5 .stat:nth-child(odd){border-inline-start:0}.stats-5 .stat:nth-child(n+3){border-top:1px solid var(--line)}}
.off-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.off-items{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.fold summary{cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2::before{content:"▸ ";color:var(--muted)}
.fold[open] summary h2::before{content:"▾ "}
/* Game tables become cards on phones: main line first, details wrapping underneath, buttons last. */
@media (max-width:700px){
  .cards-m thead{display:none}
  .cards-m,.cards-m tbody{display:block}
  .cards-m tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .cards-m tr:last-child{border-bottom:0}
  .cards-m td{display:block;border:0;padding:0}
  .cards-m td.c-main{flex-basis:100%;order:-1}
  .cards-m td.c-act{flex-basis:100%;margin-top:4px}
  .cards-m td.r{text-align:start}
  .cards-m .row-actions{flex-wrap:wrap!important}
}
/* Right-to-left (Hebrew): chess notation, the board and time charts keep reading left to right. */
.cboard,.moves,.line-box,.wbars,.week,.vctl,.spark,.chart{direction:ltr}
[dir="rtl"] .line-box{text-align:left}
[dir="rtl"] span.num,[dir="rtl"] b.num{unicode-bidi:plaintext}
.rep-vs bdi{text-transform:none}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}
[dir="rtl"] .crumb{direction:rtl}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square'
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {

      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(tokens[4]) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }

    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }

    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {

            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false

      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }

      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')

      return { valid: false, error_number: 11, error: errors[11] }
    }

    return { valid: true, error_number: 0, error: errors[0] }

    var last_sq = SQUARES.h1

    var legal =

    if (typeof options !== 'undefined' && 'square' in options) {

      if (i & 0x88) {
        i += 7

      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break

     * single square move generation on the king's square

    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }

     * to be captured)
     */
    if (!legal) {

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])

   * disambiguation bugs in Fritz and Chessbase.  See below:

   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4

    } else if (move.flags & BITS.QSIDE_CASTLE) {

    } else {

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {
      /* from the ECMA-262 spec (section 12.6.4):
       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))
      }
      return keys
    })(),
    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete comments */
      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves
        .join(',')
        .replace(/,,+/g, ',')
        .split(',')
      var move = ''

      for (var half_move = 0; half_move < moves.length - 1; half_move++) {
        move = move_from_san(moves[half_move], sloppy)

        /* move not possible! (don't clear the board to examine to show the
         * latest valid position)
         */
        if (move == null) {
          return false
        } else {
          make_move(move)

function makeDbStore(db, userId){

    const ref = coll.doc("lock-"+docId); if (typeof ref.acquire!=="function") return;

    const big = docs.find(([,,v])=>JSON.stringify(v).length > DOC_LIMIT);
    if (big) return Promise.reject({code:"too_large", message:s.name+(big[0]?" ("+big[2].year+")":"")});

    subscribe(){

    }

  }

        state.students.forEach(o=>{ if (o!==s && o.portal && o.portal.uid===uid){ delete o.portal; saveStudent(o); } });
        families().forEach(o=>{ if (o!==f && o.portal && o.portal.uid===uid) delete o.portal; });
        if (s){ s.portal = {uid, linkedAt:today()}; delete s.invite; saveStudent(s); }

        watchInbox(uid); if (s) schedule(s.id); else scheduleFamily(f.id);

    }, ()=>{});
  }
  return {
    start(){ watchLinks(); state.students.forEach(s=>{ if (s.portal && s.portal.uid){ watchInbox(s.portal.uid); schedule(s.id); } });

    discard(key){ const i = issues[key]; if (!i) return; delete issues[key]; if (i.opId) db.doc("portal/"+i.uid+"/inbox/"+i.opId).delete().catch(()=>{}); render(); },
    schedule, scheduleFamily, scheduleAll(){ state.students.forEach(s=>schedule(s.id)); families().forEach(f=>scheduleFamily(f.id)); },

// The student's side: their copy of the records (view), plus their own changes (inbox) on top.
function makeStudentStore(db, account){
  const root = db.doc("portal/"+account), view = {}, inbox = {};
  let me = {}, base = null, rebuildLater = false, childId = "";
  try { childId = localStorage.getItem("cb-child")||""; } catch(e){}
  // The coach's app says whether this account is a student's or a parent's.
  const setRole = ()=>{ ROLE = me.role==="parent" ? "parent" : "student"; document.body.classList.toggle("parent-mode", PARENT()); };
  const clone = v=>JSON.parse(JSON.stringify(v));
  function rebuild(){
    setRole();
    // A parent sees one child at a time (state holds only that child); a student sees themselves.
    const fam = PARENT() && view.family, kids = fam ? (fam.children||[]) : [];
    if (fam){ if (!kids.some(k=>k.id===childId)) childId = kids[0] ? kids[0].id : ""; state.family = {name:fam.name, children:kids, current:childId}; }
    const main = fam ? view["ch-"+childId] : view.student, sid = main && main.id;
    if (!main){ state.students = []; state.assignments = []; state.games = []; base = null; return; }
    const s = joinStudent(main, Object.keys(view).filter(k=>k.startsWith(fam ? "lg-"+sid+"-" : "lg-")).map(k=>view[k]));
    state.assignments = Object.keys(view).filter(k=>k.startsWith("as-")).map(k=>clone(view[k])).filter(a=>!fam || a.studentId===sid);
    state.games = Object.keys(view).filter(k=>k.startsWith("gm-")).map(k=>clone(view[k])).filter(g=>!fam || g.studentId===sid);
    state.students = [s];
    const mine = Object.values(inbox).filter(op=>!fam || op.sid===sid);
    mine.sort((a,b)=>(a.at||"")<(b.at||"")?-1:1).forEach(op=>applyOp(s, op, false));
    const head = fam || main;
    Object.assign(state.settings, {coachName:head.coachName||"", weekStart:head.weekStart||0, currency:(main.pay && main.pay.currency)||""});
    s.syncedAt = (fam && fam.syncedAt > (main.syncedAt||"") ? fam.syncedAt : main.syncedAt)||""; s.waiting = mine.length;
    s.waitingSince = mine.reduce((m,op)=>!m || (op.at && op.at<m) ? op.at : m, "");
    s.pay = main.pay || null;
    // Drop windows that have passed since the coach's app last wrote them.
    const now = new Date(), t = today(), nm = Math.ceil((now.getHours()*60+now.getMinutes())/30)*30;
    const fresh = (L, min)=>(L||[]).filter(f=>f.date>t || (f.date===t && toMin(f.to)-nm>=min)).map(f=>f.date===t && toMin(f.from)<nm ? Object.assign({}, f, {from:fmtMin(nm)}) : f);
    s.free = fresh(main.free, FREE_MIN); s.taken = fresh(main.taken, 1);
    s.freeSet = !!main.freeSet;
    base = clone(s);
  }
  // Rebuilding swaps the student object, so it waits while a form is open (the form edits the current one).
  const refresh = ()=>{ if ($("#modal").open){ rebuildLater = true; return; } rebuild(); render(); };
  $("#modal").addEventListener("close", ()=>{ if (rebuildLater){ rebuildLater = false; setTimeout(()=>{ rebuild(); render(); }, 0); } });
  function send(op){
    op.at = new Date().toISOString(); if (PARENT()) op.sid = childId;
    const id = "op-"+uid(); inbox[id] = op; setSync("busy");
    return root.collection("inbox").doc(id).set(op).then(()=>setSync("ok"), ()=>setSync("err"));
  }
  const track = (col, snap)=>snap.docChanges().forEach(ch=>{ if (ch.type==="removed") delete col[ch.doc.id]; else col[ch.doc.id] = clone(ch.doc.data()); });
  return {
    kind:"student",
    me:()=>me,
    async loadAll(){
      const [r, v, i] = await Promise.all([root.get(), root.collection("view").get(), root.collection("inbox").get()]);
      me = r.exists ? clone(r.data()) : {};
      v.docs.forEach(d=>{ view[d.id] = clone(d.data()); }); i.docs.forEach(d=>{ inbox[d.id] = clone(d.data()); });
      if (me.lang) state.settings.lang = me.lang;
      rebuild();
    },
    subscribe(){
      root.onSnapshot(d=>{ const was = me.role; me = d.exists ? clone(d.data()) : {}; if (me.role!==was) rebuild(); else setRole(); if (!$("#modal").open) render(); }, ()=>{});
      root.collection("view").onSnapshot(snap=>{ track(view, snap); refresh(); }, ()=>{});
      root.collection("inbox").onSnapshot(snap=>{ if (snap.metadata && snap.metadata.hasPendingWrites) return; track(inbox, snap); refresh(); }, ()=>{});
    },
    link(code){ me = Object.assign({}, me, {code:String(code).trim().toUpperCase(), lang:state.settings.lang||"en", linked:false, error:"", unlinked:false}); return root.set(me); },
    saveLang(){ me = Object.assign({}, me, {lang:state.settings.lang}); root.set(me).catch(()=>{}); },
    send,
    pickChild(id){ childId = id; try { localStorage.setItem("cb-child", id); } catch(e){} rebuild(); render(); },
    // What the student changed in the lists they may edit becomes inbox changes.
    saveStudent(){
      const s = state.students[0]; if (!s || !base || PARENT()) return;
      PORTAL_KEYS.forEach(k=>{
        const before = new Map((base[k]||[]).map(x=>[x.id, JSON.stringify(x)])), now = s[k]||[];
        now.forEach(x=>{ if (before.get(x.id)!==JSON.stringify(x)) send({type:k+".upsert", item:clone(x)}); });
        before.forEach((j, id)=>{ if (!now.some(x=>x.id===id)) send({type:k+".delete", id}); });
      });
      base = clone(s);
    },
    saveGame(id){ const g = !PARENT() && state.games.find(x=>x.id===id); if (g) send({type:"game.upsert", item:clone(g)}); },
    deleteGame(id){ if (!PARENT()) send({type:"game.delete", id}); },
    saveAssignment(id){ const a = !PARENT() && state.assignments.find(x=>x.id===id); if (a) send({type:"assignment.status", id, status:a.status, date:today()}); },
    deleteAssignment(){}, deleteStudent(){}, saveSettings(){ this.saveLang(); }
  };
}
function setSync(kind, msg){

async function initStore(){
  let db = null, userApi = null, userId = null;
  try {
    if (window.claude && typeof window.claude.use==="function"){
      [db, userApi] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (userApi) userId = await userApi.id();
    }
  } catch(e){ db = null; }
  // Anyone but the owner is a student: they get their own page, never the coach's records.
  const owner = userApi && typeof userApi.isOwner==="function" ? await userApi.isOwner().catch(()=>true) : true;
  if (db && userId && !owner){
    ROLE = "student"; document.body.classList.add("student-mode");
    store = makeStudentStore(db, userId);
    try { await store.loadAll(); setSync("ok"); store.subscribe(); } catch(e){ setSync("err", "Couldn't load your board"); }
    loaded = true; render(); return;
  }
  if (db && userId){
    store = makeDbStore(db, userId);
    try { applyLoaded(await store.loadAll()); setSync("ok"); store.tidy(); store.subscribe(); portal = makePortal(db); portal.start();
      // Deleting a game or assignment also takes it off that student's page.
      const dg = store.deleteGame, da = store.deleteAssignment;
      store.deleteGame = id=>{ dg(id); portal.scheduleAll(); }; store.deleteAssignment = id=>{ da(id); portal.scheduleAll(); }; }
    catch(e){ store = makeLocalStore(); applyLoaded(await store.loadAll()); setSync("local"); }
  } else { store = makeLocalStore(); applyLoaded(await store.loadAll()); setSync("local"); }
  loaded = true; render();
}

// Start times (every 30 minutes) at which a lesson of `dur` minutes fits in the coach's open windows that day.
function startTimes(free, date, dur){
  const out = [];
  free.filter(f=>f.date===date).forEach(f=>{ const a = toMin(f.from), b = toMin(f.to); for (let m=Math.ceil(a/30)*30; m+dur<=b; m+=30) out.push(fmtMin(m)); });
  return [...new Set(out)].sort();
}
// What changed for the student lately: decisions on their requests, new assignments, feedback, lessons added.
const UPDATE_DAYS = 14;
function studentUpdates(s){
  const t = today(), from = addDays(t, -UPDATE_DAYS), out = [], day = d=>fmtDate(d,{weekday:"short",day:"numeric",month:"short"});
  (s.requests||[]).forEach(r=>{ if (!r.decided || r.decided<from) return;
    const x = s.sessions.find(y=>y.id===r.sessionId) || r;
    if (r.status==="approved"){
      if (r.kind==="cancel") out.push({date:r.decided, kind:"ok", text:"The lesson on "+day(r.was.date)+" was cancelled, as asked", href:"#/schedule"});
      else if (r.kind==="move") out.push({date:r.decided, kind:"ok", text:"The lesson moved to "+day(x.date)+(x.time?" at "+x.time:""), href:"#/schedule"});
      else out.push({date:r.decided, kind:"ok", text:"Your coach approved the lesson on "+day(x.date)+(x.time?" at "+x.time:""), href:"#/schedule"}); }
    else if (r.status==="declined") out.push({date:r.decided, kind:"flag", text:r.kind==="cancel" ? "The request to cancel the lesson on "+day(r.was.date)+" was declined — the lesson stays"
      : r.kind==="move" ? (r.needsAnswer ? "Your coach can't meet at the new time — choose what to do with the lesson on "+day(r.was.date)
          : r.answer==="cancel" ? "The lesson on "+day(r.was.date)+" was cancelled" : r.answer==="keep" ? "The lesson on "+day(r.was.date)+" stays as planned" : "Your coach couldn't meet at the new time for the lesson on "+day(r.was.date)) : "The request for "+day(r.date)+" "+r.time+" was declined — try another time", href:"#/schedule"}); });
  state.assignments.forEach(a=>{
    if (a.assigned && a.assigned>=from && a.status==="Assigned") out.push({date:a.assigned, kind:"board", text:"New assignment: "+a.title+(a.due?" (due "+fmtShort(a.due)+")":""), href:"#/assignment/"+a.id});
    if (a.status==="Reviewed" && a.reviewedOn && a.reviewedOn>=from) out.push({date:a.reviewedOn, kind:"ok", text:(a.feedback?"New feedback on ":"Reviewed: ")+a.title, href:"#/assignment/"+a.id}); });
  const fromReq = new Set((s.requests||[]).map(r=>r.sessionId).filter(Boolean));
  s.sessions.forEach(x=>{ if (x.added && x.added>=from && x.status==="planned" && x.date>=t && !fromReq.has(x.id)) out.push({date:x.added, kind:"board", text:"Lesson planned for "+day(x.date)+(x.time?" at "+x.time:""), href:"#/schedule"}); });
  return out.sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
}
