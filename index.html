function lessonSoon(s){
  const t = today(), tm = addDays(t,1), nowM = new Date().getHours()*60+new Date().getMinutes();
  const x = sortBy(s.sessions.filter(y=>y.status==="planned" && (y.date===tm || (y.date===t && (toMin(y.time)??1440) > nowM))),"date").sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1)[0];
  if (!x) return "";
  const pc = pendingChange(s, x);
  return '<section class="panel" style="margin-bottom:16px;border-color:var(--sq-dark);display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>'+(x.date===t?"Today":"Tomorrow")+': lesson'+(x.time?' at '+esc(x.time):'')+'</b><div class="small muted">'+[x.duration?x.duration+" min":"", x.format, x.topics].filter(Boolean).map(esc).join(" · ")+'</div></div>'+
    (pc?'<span class="tag warn">'+(pc.kind==="cancel"?"Cancel requested":"Move requested")+'</span>':'<button class="btn small" data-a="les" data-id="'+x.id+'">Can\'t make it?</button>')+'</section>';
}
function answerBox(s){
  const open = (s.requests||[]).filter(r=>r.needsAnswer).map(r=>({r, les:s.sessions.find(x=>x.id===r.sessionId)})).filter(o=>o.les && needsAnswer(s, o.les));
  if (!open.length) return "";
  const day = d=>fmtDate(d,{weekday:"long",day:"numeric",month:"short"});
  return open.map(({r, les})=>'<section class="panel" style="margin-bottom:16px;border-color:var(--warn)"><div class="panel-head"><h2>Answer needed</h2><span class="tag warn">Your lesson on '+esc(day(les.date))+'</span></div>'+
    '<p style="margin:0 0 6px">Your coach can\'t meet on '+esc(day(r.date))+' at '+esc(r.time)+'. What would you like to do with your lesson on '+esc(day(les.date))+(les.time?' at '+esc(les.time):'')+'?</p>'+
    (r.reply?'<p class="small" style="margin:0 0 10px"><b>Your coach:</b> '+esc(r.reply)+'</p>':'')+
    '<div class="row-actions"><button class="btn" data-a="ans" data-id="'+r.id+'|cancel">Cancel the lesson</button><button class="btn" data-a="ans" data-id="'+r.id+'|keep">Keep it as planned</button><button class="btn primary" data-a="ans" data-id="'+r.id+'|retry">Try another time</button></div></section>').join("");
}
// A lesson the student can still ask to change: planned, not yet started.
const changeable = x=>x.status==="planned" && (x.date>today() || (x.date===today() && (toMin(x.time)??0) > new Date().getHours()*60+new Date().getMinutes()));
function lessonActions(s, x, retry){
  const day = fmtDate(x.date,{weekday:"long",day:"numeric",month:"short"})+(x.time?" · "+x.time:"");
  const pc = pendingChange(s, x), na = !retry && needsAnswer(s, x);
  if (na) return openForm({title:"Lesson on "+day, submit:"Continue", parentOk:true, fields:[
      {name:"c",label:"Your coach can't meet at the time you asked. What would you like to do?",type:"select",options:[["keep","Keep it as planned"],["cancel","Cancel the lesson"],["retry","Try another time"]],value:"keep",full:true}],
    onSubmit:d=>{ setTimeout(()=>answerMove(s, na, d.c), 0); }});
  if (pc) return confirmBox("Withdraw your request?", "You asked to "+(pc.kind==="cancel"?"cancel":"move")+" the lesson on "+day+". Withdraw that request?", "Withdraw", ()=>cancelRequest(s, pc.id));
  if (!changeable(x)){ toast(x.status==="done" ? "This lesson is done" : "This lesson can't be changed any more"); return; }
  const picks = !!s.freeSet, free = s.free||[], dates = [...new Set(free.map(f=>f.date))].sort();
  openForm({title:"Lesson on "+day, submit:"Send to your coach", parentOk:true, fields:[
      {name:"what",label:"What do you need?",type:"select",options:[["cancel","I can't make it — cancel the lesson"],["move","Move it to another time"]],value:retry?"move":"cancel",full:true},
      picks ? {name:"date",label:"New date",type:"select",value:"",show:v=>v.what==="move",options:()=>{ const ds = dates.filter(d=>startTimes(free, d, +x.duration||60).length); return ds.length ? ds.map(d=>[d, fmtDate(d,{weekday:"long",day:"numeric",month:"short"})]) : [["","No free time in the coming weeks"]]; }}
            : {name:"date",label:"New date",type:"date",value:x.date,show:v=>v.what==="move"},
      picks ? {name:"time",label:"New start time",type:"select",value:"",show:v=>v.what==="move",options:v=>{ const ts = startTimes(free, v.date, +x.duration||60); return ts.length ? ts : [["","No free time that day for this length"]]; }}
            : {name:"time",label:"New start time",type:"time",value:x.time||"",show:v=>v.what==="move"},
      {name:"note",label:"Note for your coach",type:"textarea",value:"",placeholder:"e.g. School trip that day"}],
    onSubmit:d=>{
      const item = {id:uid(), kind:d.what, sessionId:x.id, duration:+x.duration||60, format:x.format||"In person", note:d.note};
      if (d.what==="cancel") Object.assign(item, {date:x.date, time:x.time||""});
      else {
        if (!d.date || d.date<today()) return "Choose a new date.";
        if (!d.time) return "Choose a new start time.";
        if (d.date===x.date && d.time===x.time) return "That's the same time as now.";
        if (picks && !fitsFree(free, d.date, d.time, +x.duration||60)) return "Your coach isn't free then. Choose another start time.";
        Object.assign(item, {date:d.date, time:d.time});
      }
      const op = {type:"request", item}; store.send(op); applyOp(s, op, false); render();
      toast(d.what==="cancel" ? "Cancellation request sent to your coach" : "Move request sent to your coach");
    }});
}
function requestLesson(s, pre){
  const p = pre||{}, picks = !!s.freeSet, free = s.free||[];
  const dates = [...new Set(free.map(f=>f.date))].sort();
  const durs = [["45","45"],["60","60"],["90","90"],["120","120"]];
  // With free time set, the student picks a day that has open time, then one of the start times that fit.
  // only days where a lesson of the chosen length still fits
  const fitDates = dur=>dates.filter(d=>startTimes(free, d, dur).length);
  const dateField = picks
    ? {name:"date",label:"Date",type:"select",value:p.date||"",options:v=>{ const ds = fitDates(+v.duration||60); return ds.length ? ds.map(d=>[d, fmtDate(d,{weekday:"long",day:"numeric",month:"short"})]) : [["","No free time in the coming weeks for this length"]]; }}
    : {name:"date",label:"Date",type:"date",value:p.date||addDays(today(),1)};
  const timeField = picks
    ? {name:"time",label:"Start time",type:"select",value:p.time||"",options:v=>{ const ts = startTimes(free, v.date, +v.duration||60); return ts.length ? ts : [["","No free time that day for this length"]]; }}
    : {name:"time",label:"Start time",type:"time",value:p.time||""};
  openForm({title:"Request a lesson", submit:"Send request", parentOk:true, fields:[
      {name:"duration",label:"Duration (minutes)",type:"select",options:durs,value:"60"},
      dateField, timeField,
      {name:"format",label:"Format",type:"select",options:["In person","Online"],value:"In person"},
      {name:"note",label:"Note for your coach",type:"textarea",value:"",placeholder:"e.g. I'd like to prepare for the City Open"}],
    onSubmit:d=>{
      if (!d.date || d.date<today()) return "Choose a date from today on.";
      if (!d.time) return "Choose a start time.";
      if (s.freeSet && !fitsFree(s.free||[], d.date, d.time, +d.duration)) return "Your coach isn't free then. Choose another start time or a shorter lesson.";
      const op = {type:"request", item:{id:uid(), date:d.date, time:d.time, duration:+d.duration, format:d.format, note:d.note}};
      store.send(op); applyOp(s, op, false); render(); toast("Request sent to your coach");
    }});
}

function pDashboard(v){
  const t = today(), wkEnd = addDays(t,7);
  const active = state.students.filter(s=>s.active);
  const sessions = [], tours = [], tasks = [];
  active.forEach(s=>{
    s.sessions.forEach(x=>{ if (x.status==="planned" && x.date>=t && x.date<=wkEnd) sessions.push({s,x}); });
    s.tournaments.forEach(x=>{ if ((x.end||x.start)>=t && x.start<=addDays(t,60)) tours.push({s,x}); });
  });
  state.assignments.forEach(a=>{ const s = byId(a.studentId); if (!s || !s.active) return;
    if (a.status==="Submitted") tasks.push({s,x:{title:a.title,category:a.type,due:a.submitted||t,href:"#/assignment/"+a.id,review:true}});
    else if (a.status==="Assigned" && a.due && a.due<=addDays(t,3)) tasks.push({s,x:{title:a.title,category:a.type,due:a.due,href:"#/assignment/"+a.id}});
  });
  sessions.sort((a,b)=>(a.x.date+(a.x.time||""))<(b.x.date+(b.x.time||""))?-1:1);
  tours.sort((a,b)=>a.x.start<b.x.start?-1:1); tasks.sort((a,b)=>a.x.due<b.x.due?-1:1);

// One box that finds students, lessons, games, repertoire, assignments, tournaments and books.
const foldText = v => String(v??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const SEARCH_SHOW = 6;
let searchOpen = {}; // groups expanded to show every match
function searchAll(q){
  const words = foldText(q).split(/\s+/).filter(Boolean);
  const groups = [];
  if (!words.length) return groups;
  const hit = (...parts)=>{ const h = foldText(parts.join(" ")); return words.every(w=>h.includes(w)); };
  const add = (key, label, items)=>{ if (items.length) groups.push({key, label, items}); };
  const ss = sortBy(state.students,"name");
  add("students","Students", ss.filter(s=>hit(s.name,s.level,s.contact,s.guardian,s.goals,s.notes,s.fideId,s.icfId))
    .map(s=>({title:s.name, sub:[s.level, s.active?"":"Archived"].filter(Boolean).join(" · "), href:"#/student/"+s.id})));
  const ses = []; ss.forEach(s=>s.sessions.forEach(x=>{ if ((x.topics||x.notes) && hit(x.topics,x.notes)) ses.push({s,x}); }));
  add("sessions","Lessons", ses.sort((a,b)=>a.x.date<b.x.date?1:-1).map(({s,x})=>({title:x.topics||"Lesson notes", sub:s.name+" · "+fmtDate(x.date)+(x.notes&&!hit(x.topics)?" · "+x.notes.slice(0,80):""), href:"#/student/"+s.id+"/sessions"})));
  const own = [], studied = [];
  state.games.forEach(g=>{ const s = byId(g.studentId); if (!s) return;
    if (g.kind==="study"){ if (hit(g.white,g.black,g.event,g.opening,g.theme,g.notes,g.year,g.source)) studied.push({s,g}); }
    else if (hit(g.opponent,gameEvent(g,s),g.opening,g.notes,g.round?"round "+g.round:"",g.timeControl)) own.push({s,g}); });
  add("games","Games", own.sort((a,b)=>(a.g.date||"")<(b.g.date||"")?1:-1).map(({s,g})=>({title:s.name+" "+gameTitle(g)+" "+(g.result||""), sub:[gameEvent(g,s), g.opening, fmtDate(g.date)].filter(Boolean).join(" · "), href:"#/student/"+s.id+"/games"})));
  add("studied","Studied games", studied.map(({s,g})=>({title:studyTitle(g)+" "+(g.result||""), sub:[s.name, g.theme, g.event, g.year].filter(Boolean).join(" · "), href:"#/student/"+s.id+"/studied"})));
  const rep = []; ss.forEach(s=>s.repertoire.forEach(x=>{ if (hit(x.name,x.eco,x.lines,x.notes,x.against,x.againstOther,x.firstMove)) rep.push({s,x}); }));
  add("repertoire","Repertoire", rep.map(({s,x})=>({title:x.name+(x.eco?" ("+x.eco+")":""), sub:s.name+" · "+x.color+(x.against?" · vs "+(x.againstOther||x.against):""), href:"#/student/"+s.id+"/repertoire", rep:x.name})));
  add("assignments","Assignments", state.assignments.filter(a=>byId(a.studentId) && hit(a.title,a.type,a.instructions,a.feedback,(a.games||[]).map(g=>[g.white,g.black,g.event,g.date,g.note].join(" ")).join(" ")))
    .map(a=>({title:a.title, sub:byId(a.studentId).name+" · "+a.type+" · "+(STATUS_LABEL[a.status]||a.status), href:"#/assignment/"+a.id})));
  const tr = []; ss.forEach(s=>s.tournaments.forEach(x=>{ if (hit(x.name,x.location,x.notes,x.format)) tr.push({s,x}); }));
  add("tournaments","Tournaments", tr.sort((a,b)=>(a.x.start||"")<(b.x.start||"")?1:-1).map(({s,x})=>({title:x.name, sub:[s.name, x.location, fmtDate(x.start)].filter(Boolean).join(" · "), href:"#/student/"+s.id+"/tournaments"})));
  const bk = []; ss.forEach(s=>s.books.forEach(b=>{ if (hit(b.title,b.author,b.topic,b.notes)) bk.push({s,b}); }));
  add("books","Books", bk.map(({s,b})=>({title:b.title, sub:[s.name, b.author, b.status].filter(Boolean).join(" · "), href:"#/student/"+s.id+"/books"})));
  return groups;
}
function pSearch(v, r){
  let q = ""; try { q = decodeURIComponent(r.id||""); } catch(e){ q = r.id||""; }
  v.innerHTML = '<div class="page-head" style="margin-bottom:14px"><h1>Search</h1></div>'+
    '<input id="gq" class="search search-big" type="search" placeholder="Student, opponent, opening, lesson topic, assignment…" aria-label="Search everything" autocomplete="off" value="'+esc(q)+'"><div id="gres"></div>';
  const input = $("#gq"), out = $("#gres");
  const draw = ()=>{
    const val = input.value.trim(), groups = searchAll(val);
    if (!val){ out.innerHTML = '<p class="empty">Search across all students: names, lesson topics and notes, games and opponents, openings and repertoire lines, assignments, tournaments and books. Press <kbd>/</kbd> anywhere to jump here.</p>'; return; }
    if (!groups.length){ out.innerHTML = '<p class="empty">Nothing matches “'+esc(val)+'”.</p>'; return; }
    const n = groups.reduce((a,g)=>a+g.items.length,0);
    out.innerHTML = '<p class="small muted" style="margin:0 0 10px">'+n+' result'+(n===1?"":"s")+'</p><div class="grid g2">'+groups.map(g=>{
      const all = searchOpen[g.key], shown = all ? g.items : g.items.slice(0,SEARCH_SHOW);
      return panel(g.label+" ("+g.items.length+")", '<div>'+shown.map(it=>'<a class="hit" href="'+it.href+'"'+(it.rep?' data-rep="'+esc(it.rep)+'"':'')+'><div class="title">'+esc(it.title)+'</div>'+(it.sub?'<div class="small muted">'+esc(it.sub)+'</div>':'')+'</a>').join("")+'</div>'+
        (g.items.length>shown.length?'<button class="btn small ghost" data-more="'+g.key+'" style="margin-top:6px">Show all '+g.items.length+'</button>':''));
    }).join("")+'</div>';
  };
  let tmr;
  input.oninput = ()=>{ clearTimeout(tmr); tmr = setTimeout(()=>{ searchOpen = {}; draw(); try { history.replaceState(null, "", "#/search/"+encodeURIComponent(input.value.trim())); } catch(e){} }, 120); };
  out.onclick = e=>{
    const more = e.target.closest("[data-more]"); if (more){ searchOpen[more.dataset.more] = true; draw(); return; }
    // Opening a repertoire line shows just that line on the student's Repertoire tab.
    const a = e.target.closest("[data-rep]"); if (a){ repOpening = ""; repQuery = a.dataset.rep; repFilter = "all"; }
  };
  draw();
  setTimeout(()=>{ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
}

const RATING_SOURCES = ["FIDE","FIDE Rapid","FIDE Blitz","ICF","Online"];
const mainSource = s => s.ratingType==="ICF" ? "ICF" : s.ratingType==="Online" ? "Online" : "FIDE";
const fideUrl = id => "https://ratings.fide.com/profile/"+encodeURIComponent(id);
const icfUrl = id => "https://www.chess.org.il/Players/Player.aspx?Id="+encodeURIComponent(id);
function addRating(s, source, value, date){
  date = date || today(); value = +value;
  const same = s.ratings.find(r=>(r.source||mainSource(s))===source && r.date.slice(0,7)===date.slice(0,7));
  if (same){ same.value = value; same.date = date; } else s.ratings.push({id:uid(), date, value, source});
  if (source===mainSource(s)){ const latest = sortBy(s.ratings.filter(r=>(r.source||mainSource(s))===source),"date").pop(); if (latest) s.rating = latest.value; }
}
function editStudent(s){

      {name:"goals",label:"Goals",type:"textarea",value:x.goals},

      {name:"notesShared",label:"Coach notes in the student app",type:"select",options:[["0","Private — only you see them"],["1","Visible to the student"]],value:x.notesShared?"1":"0",full:true}
    ],

      state.students = state.students.filter(y=>y.id!==x.id); store.deleteStudent(x.id);
      families().forEach(f=>{ if ((f.studentIds||[]).includes(x.id)){ f.studentIds = f.studentIds.filter(y=>y!==x.id); saveSettings(); } }); state.assignments.filter(a=>a.studentId===x.id).forEach(a=>store.deleteAssignment(a.id)); state.assignments = state.assignments.filter(a=>a.studentId!==x.id); state.games.filter(g=>g.studentId===x.id).forEach(g=>store.deleteGame(g.id)); state.games = state.games.filter(g=>g.studentId!==x.id); location.hash="#/students"; toast("Student deleted"); })},
    onSubmit:d=>{

      if (fid && !/^\d{3,10}$/.test(fid)) return "The FIDE ID should be digits only, like 2807681.";
      if (iid && !/^\d{1,10}$/.test(iid)) return "The ICF ID should be digits only, like 20256.";
      if (fid && state.students.some(y=>y.id!==x.id && y.fideId===fid)) return "Another student already has FIDE ID "+fid+".";
      if (iid && state.students.some(y=>y.id!==x.id && y.icfId===iid)) return "Another student already has ICF ID "+iid+".";
      const oldRating = x.rating, oldRate = +x.rate||0;

      Object.assign(x,{name:d.name,fideId:fid,icfId:iid,noId:d.idStatus==="none"&&!fid&&!iid,rating:d.rating,ratingType:d.ratingType,level:d.level,birthYear:d.birthYear,contact:d.contact,guardian:d.guardian,rate:d.rate===""?0:d.rate,active:d.active==="1",goals:d.goals,notes:d.notes,notesShared:d.notesShared==="1"});
      if (d.rating!=="" && d.rating!==oldRating && d.ratingType!=="Unrated") addRating(x, mainSource(x), d.rating);
      // A new fee applies to weekly slots and upcoming planned sessions that were on the old fee.
      // Sessions and slots with a fee of their own, and anything already done, keep their price.
      let repriced = 0;
      if (!isNew && (+x.rate||0)!==oldRate){ const t = today(), onOld = v=>v!==""&&v!=null&&+v===oldRate;

function ratingChart(pts){
  if (pts.length<2) return '<p class="empty">Add at least two ratings to see a trend.</p>';
  const W=560,H=170,pl=40,pr=12,pt=12,pb=24;
  const vals = pts.map(p=>+p.value); let mn = Math.min(...vals), mx = Math.max(...vals); if (mx-mn<40){ mn-=20; mx+=20; }
  mn = Math.floor(mn/10)*10; mx = Math.ceil(mx/10)*10;
  const t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length-1].date).getTime() || t0+1;
  const X = d => pl + (W-pl-pr)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));
  const Y = v => pt + (H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g = ""; for (let i=0;i<=3;i++){ const v = mn+(mx-mn)*i/3, y = Y(v); g += '<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  const path = pts.map((p,i)=>(i?"L":"M")+X(p.date).toFixed(1)+","+Y(+p.value).toFixed(1)).join("");
  const area = path+"L"+X(pts[pts.length-1].date).toFixed(1)+","+(H-pb)+"L"+pl+","+(H-pb)+"Z";
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Rating history">'+g+'<path class="area" d="'+area+'"/><path class="line" d="'+path+'" vector-effect="non-scaling-stroke"/>'+
    pts.map(p=>'<circle cx="'+X(p.date)+'" cy="'+Y(+p.value)+'" r="3.5" vector-effect="non-scaling-stroke"><title>'+esc(fmtDate(p.date))+': '+esc(p.value)+'</title></circle>').join("")+
    '<text x="'+pl+'" y="'+(H-6)+'">'+esc(fmtShort(pts[0].date))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtShort(pts[pts.length-1].date))+'</text></svg>';
}

// Codes avoid letters and digits that are easy to mix up (O/0, I/1).
function inviteCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c;
  do { c = ""; const r = crypto.getRandomValues(new Uint32Array(6)); r.forEach(n=>{ c += A[n % A.length]; }); } while (state.students.some(x=>x.invite && x.invite.code===c) || families().some(x=>x.invite && x.invite.code===c));
  return c;
}

function editSession(s, x){
  const ack = {}; const before = x ? {date:x.date, time:x.time} : null;
  crud(s,"sessions",x,[
    {name:"date",label:"Date",type:"date",value:x?.date||today(),required:true},
    {name:"time",label:"Start time",type:"time",value:x?.time||""},

  ],"session","Session",

  (y)=>{ const sl = y.slotId && (s.slots||[]).find(z=>z.id===y.slotId); if (sl){ sl.skip = sl.skip||[]; sl.skip.push(y.slotDate||y.date); } });

// A short message for the parents: what the lesson covered, open homework and the next lesson. Editable before sending.
function summaryText(s, x, withNotes, lng){
  const he = lng==="he", first = s.name.split(" ")[0], t = x.date;
  const fd = (d, o)=>new Date(d+"T00:00").toLocaleDateString(he?"he-IL":undefined, o);
  const hw = sortBy(state.assignments.filter(a=>a.studentId===s.id && a.status==="Assigned"),"due");
  const next = sortBy(s.sessions.filter(y=>y.status==="planned" && y.date>t),"date")[0];
  const long = {weekday:"long",day:"numeric",month:"long"}, short = {weekday:"short",day:"numeric",month:"short"};
  const hi = s.guardian ? (he?"שלום ":"Hi ")+s.guardian.split(" ")[0]+"," : (he?"שלום,":"Hi,");
  const out = [hi, "", he ? "הנה סיכום שיעור השחמט של "+first+" מ"+fd(t,long)+"." : "Here is a summary of "+first+"’s chess lesson on "+fd(t,long)+"."];
  if (x.topics) out.push("", (he?"עבדנו על: ":"We worked on: ")+x.topics);
  if (withNotes && x.notes) out.push("", x.notes);
  if (hw.length) out.push("", he?"משימות:":"Assignments:", ...hw.map(a=>"• "+a.title+(a.due?(he?" (עד ":" (by ")+fd(a.due,short)+")":"")));
  if (next) out.push("", he ? "השיעור הבא: "+fd(next.date,long)+(next.time?" בשעה "+next.time:"")+"." : "Next lesson: "+fd(next.date,long)+(next.time?" at "+next.time:"")+".");
  if (state.settings.coachName) out.push("", state.settings.coachName);
  return out.join("\n");
}
// Pull a phone number (for WhatsApp, as an international number) and an email address out of the free-text contact field.
// Local numbers starting with 0 are read as Israeli (+972).
function contactParts(c){
  c = String(c||"");
  const email = (c.match(/[^\s,;<>]+@[^\s,;<>]+\.[^\s,;<>]+/)||[])[0] || "";
  let ph = ((c.replace(email,"")).match(/\+?\d[\d\s\-().]{6,}\d/)||[])[0] || "";
  ph = ph.replace(/[^\d+]/g,"");
  if (ph.startsWith("+")) ph = ph.slice(1); else if (ph.startsWith("00")) ph = ph.slice(2); else if (ph.startsWith("0")) ph = "972"+ph.slice(1);
  return {email, phone: ph.length>=9 ? ph : ""};
}

function bestScores(s, from){
  const modes = {};
  sortBy(s.worklog.filter(w=>w.what==="Tactics" && w.site && exKind(w.site,w.exercise)==="score" && runsOf(w).length),"date").forEach(w=>{ const k = w.site+"|"+w.exercise; (modes[k]=modes[k]||[]).push(w); });
  const keys = Object.keys(modes);
  if (!keys.length) return '<p class="empty" style="padding:4px 0">Log a Puzzle Rush, Puzzle Storm, Streak or Battle session to track best scores here.</p>';
  return '<div class="pb-grid">'+keys.sort((a,b)=>{ const la = modes[a][modes[a].length-1].date, lb = modes[b][modes[b].length-1].date; return la<lb?1:-1; }).map(k=>{
    const [site, ex] = k.split("|"), all = modes[k];
    const pb = personalBest(s, site, ex);
    const inP = all.filter(w=>w.date>=from); const runs = inP.flatMap(runsOf);
    // sparkline: every attempt in the period (last 40), dashed line at the personal best
    const pts = runs.slice(-40); let spark = "";
    if (pts.length>1){
      const W=220, H=44, lo = Math.min(...pts, pb.score)*0.9, hi = pb.score*1.05 || 1;
      const X = i=>4+(W-8)*i/(pts.length-1), Y = v=>H-4-(H-8)*(v-lo)/Math.max(1,hi-lo);
      spark = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="'+W+'" y1="'+Y(pb.score)+'" y2="'+Y(pb.score)+'" class="pbl"/><polyline points="'+pts.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")+'"/>'+pts.map((v,i)=>v===pb.score?'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3"/>':"").join("")+'</svg>';
    }
    return '<div class="pb"><div class="small muted">'+esc(site)+' · '+esc(ex)+'</div>'+
      '<div class="pb-top"><span class="pb-v num">'+pb.score+'</span><span class="small">personal best<br><span class="muted">'+esc(fmtDate(pb.date))+'</span></span></div>'+
      spark+
      '<div class="small muted">'+(runs.length ? runs.length+' attempt'+(runs.length===1?"":"s")+' in period · best '+Math.max(...runs)+' · avg '+avg(runs).toFixed(1) : 'No attempts in this period')+'</div></div>';
  }).join("")+'</div>';
}
function tacticsStats(s, days){
  const t = today(), from = days ? addDays(t, -days+1) : "0000";
  const logs = s.worklog.filter(w=>w.what==="Tactics" && w.date>=from);
  const acc = logs.filter(w=>w.attempted!==""&&w.attempted!=null&&+w.attempted>0);
  const att = acc.reduce((a,w)=>a+(+w.attempted||0),0), cor = acc.reduce((a,w)=>a+(+w.correct||0),0);
  const mins = acc.reduce((a,w)=>a+(+w.minutes||0),0);
  const pct = (c,a)=>a ? Math.round(c/a*100) : null;
  // weekly accuracy for the last 8 weeks (always shown, independent of the period filter)
  const weeks = [];
  for (let i=7;i>=0;i--){ const end = addDays(t,-7*i), start = addDays(end,-6);
    const ws = s.worklog.filter(w=>w.what==="Tactics" && w.date>=start && w.date<=end && +w.attempted>0);
    const a = ws.reduce((x,w)=>x+(+w.attempted||0),0), c = ws.reduce((x,w)=>x+(+w.correct||0),0);
    weeks.push({start, end, a, c, p:pct(c,a)}); }
  // per source
  const groups = {};
  sortBy(logs.filter(w=>w.site&&w.exercise),"date").forEach(w=>{ const k = w.site+"|"+w.exercise; (groups[k]=groups[k]||[]).push(w); });
  const rows = Object.keys(groups).map(k=>{
    const [site, ex] = k.split("|"), list = groups[k], kind = exKind(site, ex);
    if (kind==="score") return null;
    const L = list.filter(w=>+w.attempted>0); const a = L.reduce((x,w)=>x+(+w.attempted||0),0), c = L.reduce((x,w)=>x+(+w.correct||0),0);
    let extra = "";
    if (kind==="rated"){ const r = list.filter(w=>w.prating!==""&&w.prating!=null); if (r.length){ const d = +r[r.length-1].prating - +r[0].prating; extra = "Rating "+r[r.length-1].prating+(r.length>1?" ("+(d>=0?"+":"")+d+")":""); } }
    if (!a && !extra) return null;
    return {site, ex, att:a||"", acc:a?pct(c,a)+"%":"", extra, date:list[list.length-1].date};
  }).filter(Boolean).sort((x,y)=>x.date<y.date?1:-1);
  const p = pct(cor,att);
  const best = bestScores(s, from);
  const maxA = Math.max(1, ...weeks.map(w=>w.a));
  return (att ? '<div class="tstats">' : '<div class="tstats" hidden>')+
      '<div><div class="v num">'+att+'</div><div class="l">Attempted</div></div>'+
      '<div><div class="v num">'+cor+'</div><div class="l">Correct</div></div>'+
      '<div><div class="v num">'+(p===null?"—":p+"%")+'</div><div class="l">Accuracy</div></div>'+
      '<div><div class="v num">'+(att&&mins?(att/mins).toFixed(1):"—")+'</div><div class="l">Puzzles per minute</div></div></div>'+
    '<h3 class="subh">Best scores</h3>'+best+
    '<h3 class="subh">Accuracy by week</h3>'+
    '<div class="wbars" role="img" aria-label="Weekly tactics accuracy for the last 8 weeks">'+weeks.map(w=>'<div title="'+esc(fmtShort(w.start))+' – '+esc(fmtShort(w.end))+': '+(w.a?w.c+"/"+w.a+" correct":"no puzzles")+'"><span class="pct num">'+(w.p===null?"":w.p+"%")+'</span><span class="bar" style="height:'+(w.p===null?0:Math.max(4,w.p))+'%"></span><span class="vol" style="width:'+Math.round(w.a/maxA*100)+'%"></span><span class="wl">'+esc(fmtDate(w.start,{day:"numeric",month:"numeric"}))+'</span></div>').join("")+'</div>'+
    '<p class="small muted" style="margin:4px 0 0">Bar height is accuracy; the thin line under each week shows how many puzzles were attempted.</p>'+
    (rows.length?'<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Where</th><th class="r">Attempted</th><th class="r">Accuracy</th><th>Progress</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td><b>'+esc(r.site)+'</b><div class="small muted">'+esc(r.ex)+'</div></td><td class="r num">'+esc(r.att)+'</td><td class="r num">'+esc(r.acc)+'</td><td class="small">'+esc(r.extra)+'</td></tr>').join("")+'</tbody></table></div>'
      :'<p class="empty">No tactics logged in this period.</p>');
}

  const total = days.reduce((a,x)=>a+x.m,0), active = days.filter(x=>x.m>0).length;

      (()=>{ const n = s.worklog.length, shown = Math.min(n, workShown[s.id]||25); return n>shown ? '<div class="row-actions" style="margin-top:8px;align-items:center"><span class="small muted" style="margin-inline-end:auto">Showing '+shown+' of '+n+'</span><button class="btn small" data-a="more">Show 25 more</button><button class="btn small ghost" data-a="all">Show all</button></div>' : ""; })(),
      '<button class="btn small primary" data-a="addLog">Log practice</button>')+
    panel("Tactics statistics", '<div class="seg" role="group" aria-label="Period">'+periods.map(([n,l])=>'<button type="button" class="'+(tacPeriod===n?"on":"")+'" data-a="period" data-id="'+n+'">'+l+'</button>').join("")+'</div>'+tacticsStats(s, tacPeriod))+
  '</div>';
  bindActions(el,{
    period:id=>{ tacPeriod = +id; render(); },
    more:()=>{ workShown[s.id] = (workShown[s.id]||25) + 25; render(); },

    addLog:()=>openPractice(s, null),
    editLog:id=>openPractice(s, s.worklog.find(x=>x.id===id))
  });
}

function bookLabel(b){ return b.title+(b.pages?" (p. "+(+b.page||0)+"/"+b.pages+")":(b.page?" (p. "+b.page+")":"")); }
function openPractice(s, entry, preset){
  const t = today(), x = entry || preset || null;
  const isTac = v=>v.what==="Tactics";
  const kindOf = v=>exKind(v.site, v.exercise);
  const counted = v=>isTac(v) && kindOf(v)!=="score";
  const isSrc = v=>SOURCE_CATS.includes(v.what);
  const isGame = v=>v.what==="Game analysis";
  const isCB = v=>isSrc(v) && v.src==="ChessBase file";
  const bookRequired = v=>(isTac(v) && v.site==="Book / workbook") || (isSrc(v) && v.src==="Book");
  const showBook = v=>bookRequired(v) || (!isTac(v) && !isSrc(v) && !isGame(v) && s.books.length>0);
  const uniq = arr=>[...new Set(arr.filter(Boolean))];
  const cbFiles = uniq(sortBy(s.worklog,"date",-1).map(w=>w.cbFile));
  const gameOpts = v=>{ const rank = {"Not analysed":1,"In progress":0,"Analysed by student":2,"Reviewed with coach":3};
    if (v.gWhose==="other"){ const st = studyGames(s.id).slice().sort((a,b)=>(rank[a.analysis||"Not analysed"]-rank[b.analysis||"Not analysed"]) || ((b.added||"")>(a.added||"")?1:-1));
      return st.length ? st.map(g=>[g.id, studyOption(g)]) : [["","No studied games yet — add them in Daily work → Studied games"]]; }
    const gs = studentGames(s.id).slice().sort((a,b)=>(rank[a.analysis||"Not analysed"]-rank[b.analysis||"Not analysed"]) || (a.date<b.date?1:-1));
    return gs.length ? gs.map(g=>[g.id, gameOption(g,s)]) : [["","No games yet — add them in Tournaments → Game history"]]; };
  const bookOpts = v=>{ const list = sortBy(s.books,"title").sort((a,b)=>(a.status==="Reading"?0:1)-(b.status==="Reading"?0:1)).map(b=>[b.id, bookLabel(b)]);
    return bookRequired(v) ? (list.length?list:[["","No books yet — add one in the Books tab"]]) : [["","Not from a book"], ...list]; };
  const fields = [
    {name:"date",label:"Date",type:"date",value:x?.date||t},
    {name:"minutes",label:"Minutes",type:"number",value:x?.minutes??30,min:0},
    {name:"what",label:STUDENT()?"What you worked on":"What they worked on",type:"select",options:TASK_CATS,value:x?.what||"Tactics",full:true},
    {name:"site",label:"Where",type:"select",options:Object.keys(TACTICS_SITES),value:x?.site||"Chess.com",show:isTac},
    {name:"exercise",label:"Type of exercise",type:"select",options:v=>(TACTICS_SITES[v.site]||[]).map(e=>e[0]),value:x?.exercise||"",show:isTac},
    {name:"src",label:"Where",type:"select",options:SOURCES,value:x?.src||"Book",show:isSrc},
    {name:"cbFile",label:"ChessBase file",value:x?.cbFile||"",full:true,placeholder:"e.g. Rook endings.cbv",suggest:cbFiles,show:isCB},
    {name:"cbSection",label:"Chapter or section",value:x?.cbSection||"",placeholder:"e.g. Lucena position",show:isCB},
    {name:"cbCount",label:"Positions / games covered",type:"number",value:x?.cbCount??"",min:0,show:isCB},
    {name:"gWhose",label:"Whose game",type:"select",options:[["own","A game "+s.name.split(" ")[0]+" played"],["other","A game by other players"]],value:x?.gWhose||((x?.gameId&&(state.games.find(g=>g.id===x.gameId)||{}).kind==="study")?"other":"own"),full:true,show:isGame},
    {name:"gameId",label:"Which game",type:"select",options:gameOpts,value:x?.gameId||"",full:true,show:isGame},
    {name:"gStatus",label:"Analysis status after this session",type:"select",options:ANALYSIS_STATUS.slice(1),value:x?.gStatus||"In progress",full:true,show:isGame},
    {name:"bookId",label:"Book",type:"select",options:bookOpts,value:x?.bookId||"",full:true,show:showBook},
    {name:"page",label:"Page reached",type:"number",value:x?.page??"",min:0,show:v=>showBook(v)&&!!v.bookId,hint:"The page they stopped on"},
    {name:"attempted",label:"Puzzles attempted",type:"number",value:x?.attempted??x?.count??"",min:0,show:counted,hint:"Everything they tried, right or wrong. From a book: leave both empty if they only read."},
    {name:"correct",label:"Solved correctly",type:"number",value:x?.correct??"",min:0,show:counted},
    {name:"prating",label:"Puzzle rating after",type:"number",value:x?.prating??"",min:0,show:v=>isTac(v)&&kindOf(v)==="rated",hint:"As shown on the site at the end of the session"},
    {name:"scores",label:"Score of every attempt",value:x?runsOf(x).join(", "):"",full:true,placeholder:"e.g. 24, 31, 27, 29",show:v=>isTac(v)&&kindOf(v)==="score",hint:"All runs from this session, in order, separated by commas. The best and average are worked out for you."},
    {name:"note",label:"Notes",type:"textarea",value:x?.note||"",placeholder:"e.g. Missed several back-rank ideas. For games: key moments, mistakes found, questions for the coach."}];
  const validate = d=>{
    if ((d.what==="Tactics" && d.site==="Book / workbook") || (SOURCE_CATS.includes(d.what) && d.src==="Book")){ if (!d.bookId) return "Add this book in the Books tab first, then log the session."; }
    if (SOURCE_CATS.includes(d.what) && d.src==="ChessBase file" && !d.cbFile) return "Enter the name of the ChessBase file.";
    if (d.what==="Game analysis" && !d.gameId) return d.gWhose==="other" ? "Pick the game. If it isn't listed, add it in Daily work → Studied games first." : "Pick the game. If it isn't listed, add it in Tournaments → Game history first.";
    if (d.bookId && d.page!==""){ const b = s.books.find(y=>y.id===d.bookId); if (b && b.pages && +d.page > +b.pages) return "Page "+d.page+" is past the end of the book ("+b.pages+" pages).";
      const err = pageOrderError(s, b, d.date||t, +d.page, entry && entry.id); if (err) return err; }
    if (d.what!=="Tactics") return;
    const k = exKind(d.site, d.exercise);
    if (k==="score") return parseScores(d.scores).length ? undefined : "Enter the score of each attempt, e.g. 24, 31, 27.";
    const fromBook = d.site==="Book / workbook";
    if (fromBook && d.attempted==="" && d.correct===""){ return d.page==="" ? "Enter the page reached, or the exercises attempted and solved." : undefined; }
    if (d.attempted==="" || d.correct==="") return fromBook ? "Enter both exercises attempted and solved correctly, or leave both empty." : "Enter how many puzzles were attempted and how many were solved correctly.";

  };

    if (d.what==="Tactics" && exKind(d.site,d.exercise)==="score"){ d.scores = parseScores(d.scores); d.score = Math.max(...d.scores); d.attempted = ""; d.correct = ""; }
    else { d.scores = []; d.score = ""; }
    if (!d.bookId) d.page = "";
    if (d.what!=="Game analysis"){ d.gameId = ""; d.gStatus = ""; d.gWhose = ""; }
    return d; };
  const after = (w, isNew)=>{
    if (isNew && w.what==="Tactics" && exKind(w.site,w.exercise)==="score"){
      const prev = personalBest(s, w.site, w.exercise, w), m = Math.max(...runsOf(w));
      setTimeout(()=>toast(!prev ? "First "+w.exercise+" entry — personal best set at "+m : m>prev.score ? "New personal best in "+w.exercise+": "+m+" (was "+prev.score+")" : "Practice added"),30);
    }
    if (w.bookId) syncBook(s, s.books.find(b=>b.id===w.bookId), w);
    if (w.gameId){ const g = state.games.find(x=>x.id===w.gameId);
      if (g && (!g.lastAnalysed || w.date>=g.lastAnalysed)){ g.analysis = w.gStatus; g.lastAnalysed = w.date; saveGame(g); } }
  };
  crud(s,"worklog",entry||null,fields,"practice","Practice",validate,clean,after);

// The page reached can't go back: it must be at least the page logged on or before that date
// (or the book's start page) and at most the page logged on any later date.
function pageRange(s, b, date, skipId){
  let lo = +b.startPage||0, loDate = "", hi = Infinity, hiDate = "";
  // The book's current page counts too (it may have been set by hand), unless it came from the entry being edited.
  const self = skipId && s.worklog.find(w=>w.id===skipId);
  if (!(self && self.bookId===b.id && self.date===b.lastRead && +self.page===+b.page) && (!b.lastRead || date>=b.lastRead) && +b.page>lo) lo = +b.page;
  s.worklog.forEach(w=>{ if (w.bookId!==b.id || w.id===skipId || w.page==="" || w.page==null) return;
    if (w.date<=date){ if (+w.page>lo){ lo = +w.page; loDate = w.date; } } else if (+w.page<hi){ hi = +w.page; hiDate = w.date; } });
  return {lo, loDate, hi, hiDate};
}
function pageOrderError(s, b, date, page, skipId){
  if (!b) return;
  const r = pageRange(s, b, date, skipId);
  if (page<r.lo) return "Page "+page+" is before page "+r.lo+(r.loDate?", already reached on "+fmtDate(r.loDate):", where this book is already")+". Enter the page reached in this session.";
  if (page>r.hi) return "Page "+page+" is after page "+r.hi+", logged later on "+fmtDate(r.hiDate)+". Check the date or the page.";
}
// Keep a book's current page, last-read date and status in step with the practice log.
function syncBook(s, b, w){
  if (!b) return;
  if (w.page!=="" && w.page!=null && (!b.lastRead || w.date>=b.lastRead)) b.page = +w.page;
  if (!b.lastRead || w.date>b.lastRead) b.lastRead = w.date;
  if (b.status==="Want to read" || b.status==="Paused"){ b.status = "Reading"; if (!b.started) b.started = w.date; }
  if (b.pages && +b.page>=+b.pages && b.status!=="Finished"){ b.status = "Finished"; b.finished = w.date; setTimeout(()=>toast(s.name.split(" ")[0]+" finished “"+b.title+"”"),60); }
}

function bookData(s, b){
  const t = today(), from = addDays(t,-27);
  const logs = sortBy(s.worklog.filter(w=>w.bookId===b.id),"date");
  let prev = +b.startPage||0, recent = 0; const hist = [];
  logs.forEach(w=>{ let read = null; if (w.page!==""&&w.page!=null){ read = Math.max(0, +w.page - prev); prev = +w.page; if (w.date>=from) recent += read; } hist.push({w, read}); });
  const pages = +b.pages||0, page = +b.page||0;
  const pct = pages ? Math.min(100, Math.round(page/pages*100)) : null;
  const perWeek = recent/4;
  const eta = pages && perWeek>0 && page<pages ? Math.ceil((pages-page)/perWeek) : null;
  const since = b.lastRead ? daysBetween(b.lastRead, t) : null;
  const minutes = logs.reduce((a,w)=>a+(+w.minutes||0),0);
  return {logs, hist:hist.reverse(), pct, perWeek, eta, since, minutes, recent};
}

// Each game is its own document (gm-*), linked to a student and optionally to one of their tournaments.
const TIME_CONTROLS = ["Classical","Rapid","Blitz","Online"];
const outcomeOf = g => { if (g.result==="½-½"||g.result==="1/2-1/2") return "D"; if (g.result==="1-0") return g.color==="Black"?"L":"W"; if (g.result==="0-1") return g.color==="Black"?"W":"L"; return ""; };
const OUT_LABEL = {W:"Win",D:"Draw",L:"Loss"};
function gameEvent(g, s){ const tr = g.tournamentId && s.tournaments.find(x=>x.id===g.tournamentId); return tr ? tr.name : (g.event||""); }
function gameTitle(g){ return "vs "+(g.opponent||"?")+" ("+(g.color==="Black"?"Black":"White")+")"; }
function gameOption(g, s){ const ev = gameEvent(g,s); return gameTitle(g)+" "+(g.result||"")+(ev?" · "+ev+(g.round?" R"+g.round:""):"")+(g.date?" · "+fmtShort(g.date):"")+" — "+(g.analysis||"Not analysed"); }
const studentGames = sid => state.games.filter(g=>g.studentId===sid && g.kind!=="study");
// FIDE performance rating: average opponent rating + dp for the score percentage (FIDE rating regulations, table 8.1.a).
// DP[k] is dp for a score of (50+k)%; below 50% it is the same value, negative.
const DP = [0,7,14,21,29,36,43,50,57,65,72,80,87,95,102,110,117,125,133,141,149,158,166,175,184,193,202,211,220,230,240,251,262,273,284,296,309,322,336,351,366,383,401,422,444,470,501,538,589,677,800];
function performance(list){
  const rated = list.filter(g=>+g.opponentRating>0 && outcomeOf(g));
  if (!rated.length) return null;
  const pts = rated.reduce((a,g)=>a+({W:1,D:.5,L:0})[outcomeOf(g)],0), n = rated.length;
  const avg = rated.reduce((a,g)=>a+ +g.opponentRating,0)/n, pc = Math.round(pts/n*100);
  const dp = pc>=50 ? DP[pc-50] : -DP[50-pc];
  return {rp:Math.round(avg+dp), avg:Math.round(avg), n, pts};
}
function scoreLine(list){
  const w = list.filter(g=>outcomeOf(g)==="W").length, d = list.filter(g=>outcomeOf(g)==="D").length, l = list.filter(g=>outcomeOf(g)==="L").length, n = w+d+l;
  return {w,d,l,n,pts:w+d/2,pct:n?Math.round((w+d/2)/n*100):null};
}

function importGames(s, text){
  const parts = splitPgn(text); let added = 0, unsure = 0, skipped = 0;
  const last = (s.name||"").trim().split(/\s+/).pop().toLowerCase();
  const first = (s.name||"").trim().split(/\s+/)[0].toLowerCase();
  const matches = n => { n = (n||"").toLowerCase(); return !!n && ((last.length>1 && n.includes(last)) || (first.length>1 && n.includes(first) && n.split(/[\s,]+/).includes(first))); };
  for (const pgn of parts){
    if (pgn.length > 200000){ skipped++; continue; }
    const g = parseGame(pgn), h = pgnHeaders(pgn);
    const w = matches(g.white), b = matches(g.black);
    const color = b && !w ? "Black" : "White"; if (w===b) unsure++;
    const ev = g.event, tr = ev && s.tournaments.find(t=>t.name.toLowerCase()===ev.toLowerCase() || ev.toLowerCase().includes(t.name.toLowerCase()));
    const date = /^\d{4}\.\d{2}\.\d{2}$/.test(h.Date||"") ? h.Date.replace(/\./g,"-") : today();
    const res = g.result==="1/2-1/2" ? "½-½" : g.result;
    const game = {id:"gm-"+uid(), studentId:s.id, date, opponent:color==="White"?g.black:g.white, opponentRating:(color==="White"?h.BlackElo:h.WhiteElo)||"",
      color, result:res, tournamentId:tr?tr.id:"", event:tr?tr.name:ev, round:h.Round&&h.Round!=="?"?h.Round:"", timeControl:"Classical", opening:h.Opening||h.ECO||"",
      analysis:"Not analysed", notes:"", pgn, needsCheck:w===b}; if (STUDENT()) game.by = "student";
    state.games.push(game); saveGame(game); added++;
  }
  render();
  toast(added ? "Imported "+added+" game"+(added===1?"":"s")+(unsure?". Check the side played for "+unsure+" — marked “Check side”":"")+(skipped?". "+skipped+" too large to import":"")+"." : "No games found in that file.");
}

function repKey(x){ return x.color==="Black" ? x.against : (x.firstMove||"1.e4")+"|"+x.against; }

// Used once to sort old free-text entries into the new structure.
function guessRep(x){
  const m = moveTokens(x.lines), a = String(x.against||"").replace(/\s/g,"").toLowerCase();
  if (x.color==="Black"){
    const first = m[0] || a.replace(/^1\./,"");
    const hit = {e4:"1.e4",d4:"1.d4",c4:"1.c4",nf3:"1.Nf3"}[(first||"").toLowerCase()];
    return hit ? {against:hit} : {against:"Other first moves", againstOther:x.against||""};
  }
  const fm = {e4:"1.e4",d4:"1.d4",c4:"1.c4",nf3:"1.Nf3"}[(m[0]||"").toLowerCase()] || "1.e4";
  const r = m.slice(1,6).join(" ");
  let ag = "Other defences";
  if (fm==="1.e4"){ const b = m[1]; ag = {e5:"1...e5",c5:"Sicilian (1...c5)",e6:"French (1...e6)",c6:"Caro-Kann (1...c6)",d6:"Pirc / Modern (1...d6, 1...g6)",g6:"Pirc / Modern (1...d6, 1...g6)",d5:"Scandinavian (1...d5)",Nf6:"Alekhine (1...Nf6)"}[b] || ag; }
  else if (fm==="1.d4"){ if (m[1]==="d5") ag = "1...d5 (QGD, Slav, QGA)"; else if (m[1]==="f5") ag = "Dutch (1...f5)"; else if (m[1]==="Nf6"){ ag = / g6 .*d5/.test(" "+r+" ") ? "Grünfeld" : / g6/.test(" "+r) ? "King's Indian" : / e6/.test(" "+r) ? "Nimzo / Queen's Indian" : / c5/.test(" "+r) ? "Benoni / Benko" : ag; } }

  else if (fm==="1.Nf3"){ ag = {d5:"1...d5",Nf6:"1...Nf6",c5:"1...c5"}[m[1]] || ag; }

let repFilter = "all", repOpening = "", repQuery = "";
// Opening families let one filter pick up every file on an opening from both sides of the board,
// e.g. "Caro-Kann" finds White's lines against it and the student's own Caro-Kann files as Black.
const NAME_FAMILIES = [["caro","Caro-Kann"],["sicilian","Sicilian"],["najdorf","Sicilian"],["dragon","Sicilian"],["sveshnikov","Sicilian"],["alapin","Sicilian"],["french","French"],["pirc","Pirc / Modern"],["modern defen","Pirc / Modern"],["scandinavian","Scandinavian"],["alekhine","Alekhine"],
  ["king's indian","King's Indian"],["kings indian","King's Indian"],["kid","King's Indian"],["nimzo","Nimzo / Queen's Indian"],["queen's indian","Nimzo / Queen's Indian"],["grünfeld","Grünfeld"],["grunfeld","Grünfeld"],["benoni","Benoni / Benko"],["benko","Benoni / Benko"],["dutch","Dutch"],
  ["queen's gambit","Queen's Gambit"],["qgd","Queen's Gambit"],["qga","Queen's Gambit"],["slav","Queen's Gambit"],["tarrasch","Queen's Gambit"],["italian","Italian"],["giuoco","Italian"],["ruy","Ruy Lopez"],["spanish","Ruy Lopez"],["scotch","Scotch"],["petroff","Petroff"],["petrov","Petroff"],
  ["english","English"],["catalan","Catalan"],["london","London"],["réti","Réti"],["reti","Réti"],["king's gambit","King's Gambit"],["vienna","Vienna"],["philidor","Philidor"]];
const DEF_FAMILY = {"1...d5 (QGD, Slav, QGA)":"Queen's Gambit"};
function repFamilies(x){
  const out = new Set(), nm = (x.name||"").toLowerCase();
  NAME_FAMILIES.forEach(([k,f])=>{ if (k==="kid" ? /\bkid\b/.test(nm) : nm.includes(k)) out.add(f); });

  if (!out.size && x.name) out.add(x.name.split(/\s[–-]\s|,|\(/)[0].trim());
  return [...out];
}
function repMatches(x){
  if (repOpening && !repFamilies(x).includes(repOpening)) return false;
  if (repQuery){ const q = repQuery.toLowerCase(); const hay = [x.name,x.eco,x.against,x.againstOther,x.firstMove,x.lines,x.notes].join(" ").toLowerCase(); if (!q.split(/\s+/).every(t=>hay.includes(t))) return false; }

/* ---------- openings met in games ---------- */
// The moves of a game as SAN tokens (headers, comments, variations and annotations removed).
function gameMoves(pgn){
  if (!pgn || /\[SetUp\s+"1"\]|\[FEN\s/.test(pgn)) return [];
  let b = String(pgn).replace(/\[[^\]]*\]/g," ").replace(/\{[^}]*\}/g," ").replace(/;[^\n]*/g," ").replace(/\$\d+/g," ");
  for (let i=0; i<8 && /\([^()]*\)/.test(b); i++) b = b.replace(/\([^()]*\)/g," ");
  return moveTokens(b).map(t=>t.replace(/[+#?!]+$/,"")).filter(t=>/^([a-h][1-8x]|[KQRBN][a-h1-8x]|O-O)/.test(t));
}
// Which repertoire slot a game falls into, keyed like repKey(): White by the student's first move and
// Black's defence, Black by White's first move. Also the student's own reply when they had Black.
function openingOf(g){
  const m = gameMoves(g.pgn); if (m.length<2) return null;
  const lines = m.slice(0,10).join(" ");
  if (g.color==="Black"){ const r = guessRep({color:"Black", lines}); return {color:"Black", against:r.against, key:r.against, reply:"1..."+m[1]}; }
  if (!["e4","d4","c4","Nf3"].includes(m[0])) return {color:"White", firstMove:"Other first moves", against:"Any defence", key:"Other first moves|Any defence"};
  const r = guessRep({color:"White", lines}); return {color:"White", firstMove:r.firstMove, against:r.against, key:r.firstMove+"|"+r.against};
}
function openingsPanel(s){
  const games = studentGames(s.id), withMoves = [], groups = {};

// Scores are typed as "5/9", "5.5/9", "5½/9" or just "5.5" (then the tournament's rounds are used).
function parseScore(txt, rounds){
  if (txt===undefined || txt===null) return null;
  const t = String(txt).trim().replace(/½/g,".5").replace(/,/g,".").replace(/\s+/g,"");
  if (!t) return null;
  const m = t.match(/^(\d+(?:\.5|\.0)?)(?:\/(\d+))?$/); if (!m) return null;
  const pts = parseFloat(m[1]), of = m[2] ? +m[2] : (+rounds||null);
  if (of && pts>of) return null;
  return {pts, of};
}
const fmtPts = n => (Math.floor(n)===n ? String(n) : (Math.floor(n)||"")+"½");
const fmtScore = sc => sc ? fmtPts(sc.pts)+(sc.of?"/"+sc.of:"") : "";
function compareScores(exp, act){
  if (!exp || !act) return null;
  if (exp.of && act.of && exp.of!==act.of){ const d = Math.round((act.pts/act.of - exp.pts/exp.of)*100); return {pct:true, d}; }
  return {pct:false, d:act.pts-exp.pts};
}
function diffLabel(c){
  if (!c) return "";
  if (c.d===0) return "exactly as expected";
  const v = c.pct ? Math.abs(c.d)+"%" : fmtPts(Math.abs(c.d))+" point"+(Math.abs(c.d)===1?"":"s");
  return (c.d>0?"+":"−")+v+(c.d>0?" above":" below")+" expectation";
}

  state.assignments.forEach(a=>{ if (OLD_TYPES[a.type]){ a.type = OLD_TYPES[a.type]; saveAssignment(a); } });
  state.students.forEach(s=>{

    s.tasks.forEach(x=>{
      const a = {id:"as-"+uid(), studentId:s.id, title:x.title||"Homework", type:HW_TO_TYPE[x.category]||"Other", instructions:x.details||"",
        assigned:x.createdAt||today(), due:x.due||"", status:x.done?"Submitted":"Assigned", submitted:x.done?(x.doneAt||today()):"", feedback:"", games:[]};
      state.assignments.push(a); saveAssignment(a);

function asTag(a){ const t = today();

function pgnHeaders(pgn){ const h = {}; pgn.replace(/\[(\w+)\s+"((?:[^"\\]|\\.)*)"\]/g,(m,k,v)=>{ h[k]=v; return m; }); return h; }
function splitPgn(txt){
  txt = String(txt).replace(/\r\n?/g,"\n").replace(/^\uFEFF/,"").trim();
  if (!txt) return [];
  const parts = txt.split(/\n\s*\n(?=\s*\[Event\s)/);
  return parts.map(p=>p.trim()).filter(Boolean);
}
function parseGame(pgn){
  let h = pgnHeaders(pgn), moves = 0, ok = false;
  try { const c = new Chess(); ok = c.load_pgn(pgn, {sloppy:true}); if (ok){ h = Object.assign(h, c.header()); moves = c.history().length; } } catch(e){ ok = false; }
  return { id:uid(), pgn, ok, moves, white:h.White||"?", black:h.Black||"?", result:h.Result||"*", event:h.Event&&h.Event!=="?"?h.Event:"", date:(h.Date||"").replace(/\?\?/g,"").replace(/\.+$/,""), note:"" };
}
function addPgnText(a, text){
  const games = splitPgn(text);
  if (!games.length) return {added:0, bad:0, full:false};
  let added = 0, bad = 0, full = false;
  for (const pgn of games){
    const g = parseGame(pgn);
    a.games.push(g);
    if (JSON.stringify(a).length > MAX_DOC){ a.games.pop(); full = true; break; }
    added++; if (!g.ok) bad++;
  }
  return {added, bad, full, total:games.length};
}
function reportAdd(r){
  if (!r.added && !r.full) return toast("No games found. Check that the file is a PGN.");
  let msg = "Added "+r.added+" game"+(r.added===1?"":"s");
  if (r.full) msg += ". This assignment is full — split the rest into another assignment";
  else if (r.bad) msg += ". "+r.bad+" couldn't be read move by move but the text was kept";
  toast(msg+".");
}

function boardHtml(fen, flip, last){
  const sq = [];
  fen.split(" ")[0].split("/").forEach((row,ri)=>{ let fi = 0; for (const ch of row){ if (/\d/.test(ch)){ for (let k=0;k<+ch;k++) sq.push({r:ri,f:fi++,p:null}); } else sq.push({r:ri,f:fi++,p:ch}); } });
  if (flip) sq.reverse();
  return sq.map((q,i)=>{
    const name = "abcdefgh"[q.f]+(8-q.r), dark = (q.r+q.f)%2===1, hl = last && (name===last.from || name===last.to);
    const col = i%8, row = Math.floor(i/8);
    let co = ""; if (col===0) co += '<span class="co r">'+(8-q.r)+'</span>'; if (row===7) co += '<span class="co f">'+"abcdefgh"[q.f]+'</span>';
    const pc = q.p ? '<svg class="pc '+(q.p===q.p.toUpperCase()?"w":"b")+'" viewBox="0 0 45 45" aria-hidden="true">'+PIECE_SVG[q.p.toLowerCase()]+'</svg>' : "";
    return '<div class="sq '+(dark?"d":"l")+(hl?" hl":"")+'">'+pc+co+'</div>';
  }).join("");
}
function openViewer(a, g, s, forceFlip){

  const hist = c.history({verbose:true});

  hist.forEach(mv=>{ r.move(mv.san); fens.push(r.fen()); });
  const sp = start.split(" "); let num = +sp[5]||1, black = sp[1]==="b";
  const last = (s.name||"").trim().split(/\s+/).pop().toLowerCase();
  let flip = forceFlip!==undefined ? forceFlip : !!last && last.length>1 && (h.Black||"").toLowerCase().includes(last) && !(h.White||"").toLowerCase().includes(last);
  let idx = 0;
  let mv = ""; hist.forEach((x,i)=>{

    if (black) num++; black = !black;
  });
  m.innerHTML = '<div class="modal-form"><header style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2>'+title+'</h2><p class="sub small">'+sub+'</p></div><button type="button" class="btn small ghost" id="vX" aria-label="Close">✕</button></header>'+
    '<div class="viewer"><div><div class="cboard" id="vb" aria-label="Chess board"></div><div class="vctl"><button class="btn small" data-v="first" aria-label="Start">⏮</button><button class="btn small" data-v="prev" aria-label="Previous move">◀</button><button class="btn small" data-v="next" aria-label="Next move">▶</button><button class="btn small" data-v="last" aria-label="End">⏭</button><button class="btn small ghost" data-v="flip">Flip board</button></div><p class="small muted" style="margin:6px 0 0">Use the ← → keys to step through moves.</p></div>'+
    '<div style="min-width:0">'+(g.note?'<p class="small" style="margin:0 0 8px;background:var(--sq-light);padding:8px 10px;border-radius:var(--r-sm)">'+esc(g.note)+'</p>':"")+'<div class="moves" id="vm">'+mv+(h.Result?'<span class="mn"></span><span class="res">'+esc(h.Result)+'</span>':"")+'</div></div></div></div>';
  const draw = ()=>{
    $("#vb").innerHTML = boardHtml(fens[idx], flip, idx>0 ? hist[idx-1] : null);
    m.querySelectorAll(".mv").forEach(b=>b.classList.toggle("cur", +b.dataset.i===idx));
    const cur = m.querySelector(".mv.cur"); if (cur) cur.scrollIntoView({block:"nearest"});
  };
  const go = n=>{ idx = Math.max(0, Math.min(fens.length-1, n)); draw(); };
  m.querySelectorAll("[data-v]").forEach(b=>b.onclick = ()=>{ const k = b.dataset.v; if (k==="first") go(0); else if (k==="prev") go(idx-1); else if (k==="next") go(idx+1); else if (k==="last") go(fens.length-1); else { flip = !flip; draw(); } });
  $("#vm").onclick = e=>{ const b = e.target.closest(".mv"); if (b) go(+b.dataset.i); };
  $("#vX").onclick = close;
  const key = e=>{ if (e.key==="ArrowRight"){ e.preventDefault(); go(idx+1); } else if (e.key==="ArrowLeft"){ e.preventDefault(); go(idx-1); } else if (e.key==="Home") go(0); else if (e.key==="End") go(fens.length-1); };
  m.addEventListener("keydown", key);
  m.onclose = ()=>{ m.classList.remove("wide"); m.removeEventListener("keydown", key); m.onclose = null; };
  m.showModal(); draw(); $("#vX").focus();
}

/* ---------- schedule ---------- */
/* ---------- scheduling: recurring slots, clashes, week view ---------- */
const HORIZON_DAYS = 56; // recurring sessions are created 8 weeks ahead
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const dow = d => new Date(d+"T00:00").getDay();
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? (+m[1])*60 + (+m[2]) : null; };
const fmtMin = n => pad(Math.floor(n/60)%24)+":"+pad(n%60);
function weekStartOf(d){ const ws = +(state.settings.weekStart||0); let x = d; while (dow(x)!==ws) x = addDays(x,-1); return x; }
/* ---------- free time: when the coach is available for lessons ---------- */
// settings.free holds {id, kind:"weekly", weekday, from, to, start, end}, {id, kind:"once", date, from, to}
// and {id, kind:"off", date} (a day off hides that day's free time).
const FREE_MIN = 30; // shorter gaps aren't offered
function freeRules(){ return state.settings.free||[]; }
// The coach's free windows on one date, merged, before bookings are taken out.
function freeOn(d){
  const rules = freeRules(); if (rules.some(r=>r.kind==="off" && r.date===d)) return [];
  const w = rules.filter(r=>(r.kind==="weekly" && +r.weekday===dow(d) && (!r.start || d>=r.start) && (!r.end || d<=r.end)) || (r.kind==="once" && r.date===d))
    .map(r=>[toMin(r.from), toMin(r.to)]).filter(([a,b])=>a!==null && b!==null && b>a).sort((x,y)=>x[0]-y[0]);
  const out = []; w.forEach(([a,b])=>{ const l = out[out.length-1]; if (l && a<=l[1]) l[1] = Math.max(l[1], b); else out.push([a,b]); });
  return out;
}
// What is still open: free windows minus every booked lesson and pending lesson request, and minus the past.
// "taken" is the part of the free windows other students hold, so a student sees the window split,
// never whose lesson it is (their own lessons and requests show as themselves instead).
function openSlots(from, to, sid){
  const free = [], taken = [], now = new Date(), t = today(), nowMin = now.getHours()*60+now.getMinutes();
  const cut = (win, a, b)=>win.flatMap(([p,q])=>b<=p || a>=q ? [[p,q]] : [[p,Math.min(q,a)],[Math.max(p,b),q]].filter(([u,v])=>v-u>0));
  for (let d=from; d<=to; d=addDays(d,1)){
    const orig = freeOn(d); if (!orig.length) continue;
    const past = d===t ? Math.ceil(nowMin/30)*30 : 0;
    const busy = [];
    state.students.forEach(s=>{
      s.sessions.forEach(x=>{ const a = toMin(x.time); if (x.date===d && x.status!=="cancelled" && a!==null) busy.push([a, a+(+x.duration||60), s.id]); });
      (s.requests||[]).forEach(r=>{ const a = toMin(r.time); if (r.date===d && r.status==="pending" && a!==null) busy.push([a, a+(+r.duration||60), s.id]); });
    });
    let win = cut(orig, 0, past);
    busy.forEach(([a,b])=>{ win = cut(win, a, b); });
    win.filter(([a,b])=>b-a>=FREE_MIN).forEach(([a,b])=>free.push({date:d, from:fmtMin(a), to:fmtMin(b)}));
    // other students' time inside the free windows, merged
    const tk = [];
    busy.filter(z=>z[2]!==sid).forEach(([a,b])=>orig.forEach(([p,q])=>{ const u = Math.max(a,p,past), v = Math.min(b,q); if (v>u) tk.push([u,v]); }));
    tk.sort((x,y)=>x[0]-y[0]).reduce((m,[a,b])=>{ const l = m[m.length-1]; if (l && a<=l[1]) l[1] = Math.max(l[1], b); else m.push([a,b]); return m; }, [])
      .forEach(([a,b])=>taken.push({date:d, from:fmtMin(a), to:fmtMin(b)}));
  }
  return {free, taken};
}
function freeLabel(r){
  const wd = n=>new Date(2024,0,7+(+n)).toLocaleDateString(LOCALE(),{weekday:"long"});
  if (r.kind==="off") return fmtDate(r.date,{weekday:"short",day:"numeric",month:"short"})+" · Day off";
  return (r.kind==="weekly" ? "Every "+wd(r.weekday) : fmtDate(r.date,{weekday:"short",day:"numeric",month:"short"}))+" · "+r.from+"–"+r.to;
}

// Does a lesson request fit inside one of the coach's open windows?
function fitsFree(free, date, time, dur){
  const a = toMin(time); if (a===null) return false;
  return free.some(f=>f.date===date && toMin(f.from)<=a && a+dur<=toMin(f.to));
}

// Create the planned sessions a weekly slot implies, up to the horizon. Occurrences that were moved or cancelled
// keep their slotDate, so they are never recreated.
function ensureRecurring(s){
  let changed = false; const t = today(), end = addDays(t, HORIZON_DAYS);
  (s.slots||[]).forEach(sl=>{
    if (sl.skip && sl.skip.some(d=>d<t)){ sl.skip = sl.skip.filter(d=>d>=t); changed = true; }
    let d = sl.start && sl.start>t ? sl.start : t;
    for (let i=0;i<7 && dow(d)!==+sl.weekday;i++) d = addDays(d,1);
    for (; d<=end && (!sl.end || d<=sl.end); d = addDays(d,7)){
      if (s.sessions.some(x=>x.slotId===sl.id && (x.slotDate||x.date)===d) || (sl.skip||[]).includes(d)) continue;
      s.sessions.push({id:uid(), slotId:sl.id, slotDate:d, date:d, time:sl.time, duration:sl.duration, format:sl.format, status:"planned", topics:"", notes:"", fee:sl.fee});
      changed = true;
    }
  });
  return changed;
}
function dropFutureSlotSessions(s, sl, keepCustom){
  const t = today();
  s.sessions = s.sessions.filter(x=>!(x.slotId===sl.id && x.status==="planned" && x.date>=t && (!keepCustom || !x.custom)));
}
function ensureAllRecurring(){ state.students.forEach(s=>{ if (s.active && ensureRecurring(s)) saveStudent(s); }); }

// Things that make a session a problem: another session overlapping in time (you can't teach two at once,
// except two Group sessions starting together), or the student playing a tournament that day.
function clashesFor(sid, c){
  const out = []; if (!c.date) return out;
  const st = toMin(c.time), en = st===null ? null : st + (+c.duration||60);
  state.students.forEach(o=>{
    if (!o.active) return;
    o.sessions.forEach(x=>{
      if (x.id===c.id || x.status==="cancelled" || x.date!==c.date) return;
      const a = toMin(x.time); if (a===null || st===null) return;
      const b = a + (+x.duration||60);
      if (!(a<en && st<b)) return;
      if (c.format==="Group" && x.format==="Group" && a===st) return;
      out.push({kind:"session", sid:o.id, text:(o.id===sid ? "Another session with "+o.name : o.name+"’s session")+" "+x.time+"–"+fmtMin(b)});
    });
  });
  const me = byId(sid);
  if (me) me.tournaments.forEach(t=>{ if (t.start && c.date>=t.start && c.date<=(t.end||t.start)) out.push({kind:"tour", text:me.name.split(" ")[0]+" is playing "+t.name+" that day"}); });
  return out;
}
function clashCheck(sid, c, st){
  // Returns an error for the form the first time a clash is found; saving again keeps it anyway.
  const cl = clashesFor(sid, c); const sig = cl.map(x=>x.text).join("|");
  if (!cl.length || st.ack===sig) return null;
  st.ack = sig;
  return "Clash: "+cl.map(x=>x.text).join("; ")+". Press Save again to keep it anyway.";
}

function slotLabel(sl){ return "Every "+WEEKDAYS[+sl.weekday]+" · "+sl.time+" · "+sl.duration+" min · "+sl.format+(sl.fee!==""&&sl.fee!=null?" · "+money(sl.fee):""); }
function editSlot(s, sl, preset){
  const isNew = !sl; const x = sl || Object.assign({id:uid(), weekday:dow(today()), time:"17:00", duration:90, format:"In person", fee:s.rate, start:today(), end:""}, preset||{});
  const ack = {};
  openForm({title:(isNew?"Add weekly slot":"Edit weekly slot")+" — "+s.name, submit:isNew?"Add slot":"Save changes", fields:[
      {name:"weekday",label:"Day",type:"select",options:WEEKDAYS.map((d,i)=>[String(i),d]),value:String(x.weekday)},
      {name:"time",label:"Start time",type:"time",value:x.time},
      {name:"duration",label:"Duration (minutes)",type:"number",value:x.duration,min:15},
      {name:"format",label:"Format",type:"select",options:["In person","Online","Group"],value:x.format},
      {name:"fee",label:"Fee ("+state.settings.currency+")",type:"number",value:x.fee,min:0,step:"any"},
      {name:"start",label:"Starting from",type:"date",value:x.start},
      {name:"end",label:"Until (optional)",type:"date",value:x.end,hint:"e.g. the end of the school year. Leave empty to keep going."}],
    danger: isNew?null:{label:"Delete slot", onClick:()=>{ const n = s.sessions.filter(y=>y.slotId===x.id && y.status==="planned" && y.date>=today()).length;
      confirmBox("Delete this weekly slot?", slotLabel(x)+". "+(n?"The "+n+" upcoming planned session"+(n===1?"":"s")+" it created will be removed too. ":"")+"Past sessions are kept.","Delete slot",()=>{
        dropFutureSlotSessions(s, x, false); s.slots = s.slots.filter(y=>y.id!==x.id); saveStudent(s); render(); toast("Weekly slot deleted"); }); }},
    onSubmit:d=>{
      if (!d.time) return "Choose a start time.";
      if (d.end && d.end < (d.start||today())) return "The end date is before the start date.";
      // check the next few occurrences for clashes
      let dd = d.start && d.start>today() ? d.start : today(); for (let i=0;i<7 && dow(dd)!==+d.weekday;i++) dd = addDays(dd,1);
      const hits = []; for (let k=0;k<8;k++, dd=addDays(dd,7)){ if (d.end && dd>d.end) break; clashesFor(s.id,{id:"-", date:dd, time:d.time, duration:d.duration, format:d.format}).filter(c=>c.kind==="session").forEach(c=>hits.push(fmtShort(dd)+": "+c.text)); }
      const sig = hits.join("|");
      if (hits.length && ack.sig!==sig){ ack.sig = sig; return "Clashes with "+hits.length+" upcoming session"+(hits.length===1?"":"s")+" (e.g. "+hits[0]+"). Press Save again to keep it anyway."; }
      const was = JSON.stringify([x.weekday,x.time,x.duration,x.format,x.fee,x.start,x.end]);
      Object.assign(x, {weekday:+d.weekday, time:d.time, duration:d.duration===""?90:+d.duration, format:d.format, fee:d.fee===""?s.rate:+d.fee, start:d.start||today(), end:d.end});
      if (isNew){ s.slots = s.slots||[]; s.slots.push(x); }
      else if (was!==JSON.stringify([x.weekday,x.time,x.duration,x.format,x.fee,x.start,x.end])) dropFutureSlotSessions(s, x, true);
      ensureRecurring(s); saveStudent(s); render(); toast(isNew?"Weekly slot added — sessions planned 8 weeks ahead":"Slot updated");
    }});
}

// Plan a one-off or weekly session from the Schedule or the dashboard.
function planSession(preset){
  const act = sortBy(state.students.filter(s=>s.active),"name");
  if (!act.length){ toast("Add a student first."); return; }
  const p = preset||{}; const ack = {};
  const first = byId(p.sid) || act[0];
  openForm({title:"Plan a session", submit:"Plan session", fields:[
      {name:"sid",label:"Student",type:"select",options:act.map(s=>[s.id,s.name]),value:first.id,full:true},
      {name:"repeat",label:"Repeat",type:"select",options:[["once","Just this once"],["weekly","Every week (weekly slot)"]],value:"once",full:true},
      {name:"date",label:"Date",type:"date",value:p.date||today()},
      {name:"time",label:"Start time",type:"time",value:p.time||""},
      {name:"duration",label:"Duration (minutes)",type:"number",value:90,min:15},
      {name:"format",label:"Format",type:"select",options:["In person","Online","Group"],value:"In person"},
      {name:"fee",label:"Fee ("+state.settings.currency+")",type:"number",value:"",min:0,step:"any",hint:"Leave empty to use the student's usual fee"},
      {name:"end",label:"Until (optional)",type:"date",value:"",show:v=>v.repeat==="weekly"},
      {name:"topics",label:"Topics",value:"",full:true,show:v=>v.repeat==="once",placeholder:"e.g. Rook endgames"}],
    onSubmit:d=>{
      const s = byId(d.sid); if (!s) return "Choose a student.";
      if (d.repeat==="weekly" && !d.time) return "Choose a start time for a weekly slot.";
      const fee = d.fee==="" ? s.rate : +d.fee, dur = d.duration===""?90:+d.duration;
      if (d.repeat==="weekly"){
        const sl = {id:uid(), weekday:dow(d.date||today()), time:d.time, duration:dur, format:d.format, fee, start:d.date||today(), end:d.end};
        const err = clashCheck(s.id, {id:"-", date:sl.start, time:sl.time, duration:dur, format:d.format}, ack); if (err) return err;

function scheduleItems(from, to){
  // sessions, tournaments (on every day they run) and assignment due dates between two dates
  const items = [];
  state.students.filter(s=>s.active).forEach(s=>{
    s.sessions.forEach(x=>{ if (x.date>=from && x.date<=to) items.push({kind:"session", date:x.date, s, x, clash:x.status!=="cancelled" && !STUDENT() ? clashesFor(s.id,x) : []}); });
    s.tournaments.forEach(t=>{ if (!t.start) return; const e = t.end && t.end>=t.start ? t.end : t.start; const n = daysBetween(t.start,e)+1;
      for (let d=t.start<from?from:t.start; d<=e && d<=to; d=addDays(d,1)) items.push({kind:"tour", date:d, s, x:t, day:daysBetween(t.start,d)+1, days:n}); });
  });
  state.assignments.forEach(a=>{ const s = byId(a.studentId); if (s && s.active && a.due && a.due>=from && a.due<=to && a.status==="Assigned") items.push({kind:"due", date:a.due, s, x:a}); });

    (s.requests||[]).forEach(x=>{ if (x.kind!=="cancel" && (x.status==="pending" || x.status==="declined") && x.date>=from && x.date<=to) items.push({kind:"req", date:x.date, s, x}); });

}

const HOUR_PX = 48;

function weekGrid(ws, items, n=7){

  const labels = '<div class="wk-times" style="height:'+(H*HOUR_PX)+'px">'+[...Array(H)].map((_,k)=>'<span style="top:'+(k*HOUR_PX)+'px">'+pad(h0+k)+':00</span>').join("")+'</div>';
  const cols = days.map(d=>{

    // side-by-side lanes for overlapping sessions

    evs.forEach(e=>{ if (e.a>=clEnd && cluster.length) flush(); cluster.push(e); clEnd = Math.max(clEnd, e.b); }); if (cluster.length) flush();
    const now = d===t ? (()=>{ const n = new Date(); const mm = n.getHours()*60+n.getMinutes(); return mm>=h0*60 && mm<=h1*60 ? '<div class="wk-now" style="top:'+((mm-h0*60)/60*HOUR_PX)+'px"></div>' : ""; })() : "";
    return '<div class="wk-day'+(d===t?" today":"")+'" data-date="'+d+'" data-h0="'+h0+'" style="height:'+(H*HOUR_PX)+'px" title="'+(STUDENT()?"Click an empty spot to request a lesson":"Click an empty spot to plan a session")+'">'+now+
      freeBands(d).map(([a,b])=>'<div class="wk-free" style="top:'+((a-h0*60)/60*HOUR_PX)+'px;height:'+((b-a)/60*HOUR_PX)+'px"><span>Free '+fmtMin(a)+'–'+fmtMin(b)+'</span></div>').join("")+

      const x = e.i.x, top = (e.a-h0*60)/60*HOUR_PX, ht = Math.max(22, (e.b-e.a)/60*HOUR_PX-2), cl = e.i.clash||[];

/* ---------- income report ---------- */
let incomeYear = null;
// Per month of one year: lessons marked done, what was charged (lessons + extra charges) and what was received.
function incomeData(){
  const years = new Set([today().slice(0,4)]);
  state.students.forEach(s=>{ s.payments.forEach(p=>p.date&&years.add(p.date.slice(0,4))); ledger(s).charges.forEach(c=>c.date&&years.add(c.date.slice(0,4))); });
  const list = [...years].sort().reverse(), year = list.includes(incomeYear) ? incomeYear : list[0];
  const months = [...Array(12)].map((_,i)=>({key:year+"-"+pad(i+1), lessons:0, charged:0, received:0}));
  const at = d => d && d.slice(0,4)===year ? months[+d.slice(5,7)-1] : null;
  state.students.forEach(s=>{
    s.sessions.forEach(x=>{ const m = x.status==="done" && at(x.date); if (m) m.lessons++; });
    ledger(s).charges.forEach(c=>{ const m = at(c.date); if (m) m.charged += c.amount; });
    s.payments.forEach(p=>{ const m = at(p.date); if (m) m.received += +p.amount||0; });
  });
  const total = months.reduce((a,m)=>({lessons:a.lessons+m.lessons, charged:a.charged+m.charged, received:a.received+m.received}), {lessons:0, charged:0, received:0});
  return {year, years:list, months, total};
}
function incomePanel(){
  const d = incomeData(), cur = today().slice(0,7);
  const rows = d.months.filter(m=>m.key<=cur || m.lessons || m.charged || m.received);
  return '<section class="panel" style="margin-bottom:16px"><div class="panel-head" style="flex-wrap:wrap"><h2>Income</h2><div class="row-actions">'+
      '<select id="incYear" class="search" style="min-width:auto" aria-label="Year">'+d.years.map(y=>'<option'+(y===d.year?" selected":"")+'>'+y+'</option>').join("")+'</select>'+
      '<button class="btn small" data-a="csvMonth">Monthly CSV</button><button class="btn small" data-a="csvPay">Payments CSV</button></div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Month</th><th class="r">Lessons</th><th class="r">Charged</th><th class="r">Received</th></tr></thead><tbody>'+
      rows.map(m=>'<tr><td>'+esc(fmtDate(m.key+"-01",{month:"long"}))+'</td><td class="r num">'+m.lessons+'</td><td class="r num">'+money(m.charged)+'</td><td class="r num">'+money(m.received)+'</td></tr>').join("")+
      '<tr><td><b>'+esc(d.year)+' total</b></td><td class="r num"><b>'+d.total.lessons+'</b></td><td class="r num"><b>'+money(d.total.charged)+'</b></td><td class="r num"><b>'+money(d.total.received)+'</b></td></tr>'+
    '</tbody></table></div><p class="small muted" style="margin:8px 0 0">Charged counts lessons marked done and extra charges; Received counts payments recorded. Includes archived students.</p></section>';
}

    put("overdueDays", Math.max(1,+f.overdueDays.value||30)); put("lang", f.lang.value); put("payInfo", f.payInfo.value.trim()); if (f.appLink.value.trim()!==APP_LINK()) put("appLink", f.appLink.value.trim());
    saveSettings(); render(); toast("Settings saved"); };
  $("#exp").onclick = downloadBackup;

      confirmBox("Restore backup?","This adds "+d.students.length+" students from the file. Students with the same ID are replaced; others are kept.","Restore",()=>{
        // Students first: one that gets a new ID takes its games and assignments along with it.

        const relink = x=>{ if (Object.prototype.hasOwnProperty.call(newId, x.studentId)) x.studentId = newId[x.studentId]; };
        if (Array.isArray(d.assignments)) d.assignments.forEach(a=>{ relink(a); if (!String(a.id).startsWith("as-")) a.id = "as-"+uid(); const i = state.assignments.findIndex(y=>y.id===a.id); if (i>=0) state.assignments[i]=a; else state.assignments.push(a); saveAssignment(a); });
        if (Array.isArray(d.games)) d.games.forEach(g=>{ relink(g); if (!String(g.id).startsWith("gm-")) g.id = "gm-"+uid(); const i = state.games.findIndex(y=>y.id===g.id); if (i>=0) state.games[i]=g; else state.games.push(g); saveGame(g); });
        if (d.settings){ Object.assign(state.settings,d.settings); saveSettings(); }
        toast("Backup restored"); render();
      });
    }); e.target.value = "";
  };
}
